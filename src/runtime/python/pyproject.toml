# MCP Mesh Python Package Configuration

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-mesh"
version = "3.7.1"
description = "Python SDK for MCP Mesh — build distributed AI agents with auto-discovery, dependency injection, and LLM integration"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MCP Mesh Contributors", email = "noreply@mcp-mesh.ai" }
]
keywords = [
    "mcp",
    "kubernetes",
    "ai",
    "agents",
    "orchestration",
    "microservices",
    "distributed"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.11"
# anthropic SDK is included by default for native Claude dispatch (issue #834).
# When MCP_MESH_NATIVE_LLM is unset (default ON), Claude provider agents
# dispatch through the native anthropic SDK; without the SDK they would
# silently fall back to LiteLLM. Heavy backend extras (boto3 for Bedrock)
# stay opt-in via the [anthropic-bedrock] extra.
#
# openai SDK is included by default for native OpenAI dispatch (issue #834
# PR 2). When MCP_MESH_NATIVE_LLM is unset (default ON), OpenAI provider
# agents dispatch through the native openai SDK; without it they would
# silently fall back to LiteLLM. (openai used to arrive transitively via
# litellm; since litellm left the base install in 3.5.0 — issue #1383 —
# this direct entry is the ONLY thing that installs it.)
#
# google-genai SDK is included by default for native Gemini dispatch
# (issue #834 PR 3). Supports both AI Studio (gemini/*) and Vertex AI
# (vertex_ai/*) backends via constructor flag. When MCP_MESH_NATIVE_LLM
# is unset (default ON), Gemini provider agents dispatch through the
# native google-genai SDK; without it they would silently fall back to
# LiteLLM.
dependencies = [
    # Floor raised to 0.135.0 (#1402). Below 0.133.0 FastAPI is unresolvable
    # against our own mcp/fastmcp pins (mcp==1.28.1 needs anyio>=4.5 vs old
    # FastAPI's anyio<4.0.0; fastmcp==3.4.3 needs starlette>=1.0.1 vs
    # FastAPI's starlette<1.0.0 cap, lifted in 0.133.0). 0.133/0.134 install
    # but the route/SSE suite is not green until 0.135.0, where is_sse_stream
    # lands.
    "fastapi>=0.135.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "aiohttp>=3.8.0",
    "urllib3>=2.1.0",
    "pydantic>=2.4.0",
    "python-dateutil>=2.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    # Pinned exact (#1312): an upstream FastMCP default-flip enabling
    # DNS-rebinding Host validation drifted in on rebuild and broke every
    # k8s Service-DNS /mcp call with 421. Loose ranges hid it.
    #
    # The follow-up this note used to ask for has landed: constraints.txt beside
    # this file is the full transitive lock (#1454), so the ranges below no
    # longer decide what CI tests or what the runtime images ship. Keep the
    # exact pins anyway — they are the bound a USER installing from PyPI gets,
    # and the lock is not published with the package.
    "mcp==1.28.1",
    "fastmcp==3.4.3",
    # Bounded, never pinned exactly (#1454). The vendor SDKs ship breaking
    # changes on a cadence of their own: openai crossed 1.x -> 2.x while our
    # floor still read >=1.60, and a *minor* (2.14 -> 2.52) added a required
    # response field that broke CI while local envs stayed green. An upper
    # bound at the next major is the strongest constraint expressible here —
    # an exact pin would export our testing constraint onto every user who
    # depends on these SDKs directly, which is why mcp/fastmcp above can be
    # pinned and these cannot. The bound catches the major jump only; the
    # minor-level drift is what the transitive lockfile in #1454 is for.
    #
    # openai floor raised 1.60 -> 2.14: the native adapter imports
    # ``openai.types.responses`` (verified absent in 1.60, added in 1.66) and
    # 2.14 is the oldest release the suite has actually been run against.
    #
    # anthropic is 0.x, where a minor — not a major — is the breaking unit, so
    # <1 is weaker than it looks. It is still the right bound: anthropic has
    # shipped ~120 minors over three years at a near-weekly cadence, so a
    # <0.<next-minor> cap would make mcp-mesh uninstallable alongside a
    # current anthropic within days of every release. 1.0 is the boundary
    # worth failing on; the lockfile covers everything below it.
    #
    # google-genai is capped <3, not <2: 2.0 shipped 2026-05 and a fresh
    # install has resolved 2.x ever since, so <2 would roll us back onto a 1.x
    # line nothing has tested in months.
    #
    # litellm is NOT here (issue #1383, removed in 3.5.0). It lives in the
    # [litellm] optional extra; see the comment there.
    "anthropic>=0.77,<1",
    "openai>=2.14,<3",
    "google-genai>=1.22,<3",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "redis>=4.0.0,<7.0.0",
    "cachetools>=5.3.0",
    "watchfiles>=1.0.0",
    "orjson>=3.10.0",
    "jsonschema>=4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    # Pinned compatible-release, NOT floor-only. `ruff format --check` is now a
    # hard gate in the lint-and-format CI job, so the formatter's output is part
    # of the merge criteria: with `>=` a ruff release could turn every open PR
    # red without a single repo change. The lint rules move too — UP038 was
    # removed outright, and UP045 was split out of the still-ignored UP007,
    # which is what forced the repo-wide Optional[...] sweep. `~=` still lets
    # patch releases (0.16.x) through, and the stable formatter style does not
    # move within a minor. Bumping the minor is its own reviewed diff, run
    # alongside a `ruff format` pass. Must stay identical to the pin in
    # packaging/pypi/pyproject.toml.
    "ruff~=0.16.1",
    "mypy>=1.16.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.7.0",
    # The unit suite covers the LiteLLM long-tail path (tests/unit/
    # test_provider_agentic_loop_*.py patch ``litellm.acompletion`` directly),
    # so a dev/CI environment needs the package even though a user install no
    # longer does (#1383). Self-referenced rather than restated so there is
    # exactly one litellm pin per manifest.
    "mcp-mesh[litellm]"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-mermaid2-plugin>=1.1.0"
]
kubernetes = [
    "kubernetes>=28.1.0",
    "pykube-ng>=22.9.0"
]
vertex = [
    # Backward-compat alias: ``google-auth`` is now always installed because
    # ``google-genai`` (a base dependency) requires ``google-auth[requests]
    # >=2.48.1`` transitively. This extra is preserved as a no-op so
    # ``pip install mcp-mesh[vertex]`` still resolves cleanly for users who
    # pinned it from earlier docs (Vertex AI ADC reading for the vertex_ai/*
    # model prefix).
    "google-auth>=2.0.0"
]
anthropic = [
    # Backward-compat alias: ``anthropic`` is now a base dependency (issue
    # #834 — native dispatch is default ON). This extra is preserved as a
    # no-op so ``pip install mcp-mesh[anthropic]`` still resolves cleanly
    # for users who pinned it from earlier docs.
    "anthropic>=0.77,<1"
]
anthropic-bedrock = [
    # AWS Bedrock backend for the native Anthropic adapter. Required when
    # using bedrock/anthropic.claude-* models with MCP_MESH_NATIVE_LLM=1.
    # Install via:
    #   pip install mcp-mesh[anthropic-bedrock]
    "anthropic[bedrock]>=0.77,<1"
]
openai = [
    # Backward-compat alias: ``openai`` is now a base dependency (issue
    # #834 PR 2 — native dispatch is default ON). This extra is preserved
    # as a no-op so ``pip install mcp-mesh[openai]`` still resolves cleanly
    # for users who pinned it from earlier docs.
    "openai>=2.14,<3"
]
gemini = [
    # Backward-compat alias: ``google-genai`` is now a base dependency
    # (issue #834 PR 3 — native dispatch is default ON). This extra is
    # preserved as a no-op so ``pip install mcp-mesh[gemini]`` still
    # resolves cleanly for users who pinned it from earlier docs.
    "google-genai>=1.22,<3"
]
litellm = [
    # LiteLLM long-tail provider path (issue #1383).
    #
    # THIS IS THE ONLY DECLARATION THAT INSTALLS LITELLM. The base entry was
    # deleted in 3.5.0; ``pip install mcp-mesh`` no longer pulls litellm or its
    # ~30 MB transitive tree. Anthropic / OpenAI / Gemini dispatch through the
    # bundled native SDK adapters (base dependencies) and need nothing extra.
    # Every other vendor — bedrock/*, vertex_ai/*, cohere/*, ollama/*, … —
    # routes through GenericHandler → LiteLLM and requires:
    #   pip install 'mcp-mesh[litellm]'
    # Containerized agents add the same pin to requirements.txt; ``meshctl
    # scaffold`` emits it automatically for non-big-3 models.
    #
    # Missing-package failures are caught at the import site and re-raised with
    # that guidance by ``mesh.helpers._require_litellm``.
    #
    # The extra existed as a deliberate no-op from 3.3.2 through 3.4.x so a pin
    # written against those releases keeps resolving unchanged here.
    #
    # The pin MUST stay identical to the ``litellm`` entry in the [litellm]
    # extra of packaging/pypi/pyproject.toml (the manifest PyPI publishes).
    # Enforced by tests/unit/test_litellm_extra_pin_sync.py.
    #
    # Bounded, never pinned exactly, for the same reason as the vendor SDKs
    # above: an exact pin would export our testing constraint onto every user
    # who depends on litellm directly. 1.82.7/1.82.8 are excluded upstream
    # breakages.
    "litellm>=1.80.5,!=1.82.7,!=1.82.8,<2"
]

[project.urls]
Homepage = "https://github.com/dhyansraj/mcp-mesh"
Documentation = "https://github.com/dhyansraj/mcp-mesh/tree/main/docs"
Repository = "https://github.com/dhyansraj/mcp-mesh"
Issues = "https://github.com/dhyansraj/mcp-mesh/issues"
Discussions = "https://github.com/dhyansraj/mcp-mesh/discussions"

# No CLI scripts - this is a library package
# Use the Go-based meshctl tool for CLI operations

# Version is now static above, no need for dynamic extraction

[tool.hatch.build.targets.wheel]
packages = ["_mcp_mesh", "mesh"]

[tool.hatch.build.targets.sdist]
include = [
    "/_mcp_mesh",
    "/mesh",
    "/README.md",
    "/LICENSE"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP007", # Use X | Y for type annotations (Python 3.10+ syntax)
    "F401",  # imported but unused
    "F841",  # local variable assigned but never used
    "C416",  # unnecessary list comprehension
    "C401",  # unnecessary generator
    "E721",  # type comparison issues
    "E722",  # bare except
    "B904",  # raise from err issues
    "B007",  # unused loop variables
    "F821",  # undefined name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/agent_server_generated/**" = ["ALL"]  # Ignore all linting for generated files
"**/registry_client_generated/**" = ["ALL"]  # Ignore all linting for generated files
"tests/**" = ["E712", "F841", "B007", "C401", "F401"]  # Relax style requirements for test files

[tool.mypy]
python_version = "3.11"
check_untyped_defs = false  # Temporarily relaxed
disallow_any_generics = false  # Temporarily relaxed
disallow_incomplete_defs = false  # Temporarily relaxed
disallow_untyped_defs = false  # Temporarily relaxed
no_implicit_optional = false  # Temporarily relaxed
warn_redundant_casts = false  # Temporarily relaxed
warn_unused_ignores = false  # Temporarily relaxed
warn_return_any = false  # Temporarily relaxed
exclude = ["tests/", ".*agent_server_generated.*", ".*registry_client_generated.*"]  # Skip type checking for test and generated files

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
