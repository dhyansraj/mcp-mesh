<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Mesh — scroll topology prototype</title>

    <!--
      PROTOTYPE ONLY — do not copy this into the SPA, and do not read this as a
      statement about how fonts reach a reader anywhere else in the repo.

      THE DECISION THIS COMMENT USED TO DEFER HAS BEEN TAKEN (#1522). Both
      shipping surfaces now self-host the faces: src/ui/fonts/ holds the two
      woff2 payloads and their licence, app/spa.css declares them for the
      dashboard, demo/embed.css for the docs-site bundle, and the licence is
      emitted beside them into every build that carries them. The earlier
      version of this comment said nothing in the repo ever loads the faces and
      that document.fonts is empty. Both were true when it was written and
      neither is true now.

      This file is the ONE surface still fetching them from a third party, and
      it stays that way deliberately: it is a local prototype opened straight
      off disk, it is not built, published or embedded, and pointing it at
      src/ui/fonts would mean either a build step it does not have or a relative
      path that only resolves when the file is served rather than opened. What
      ships does not do this — an air-gapped install has no route to
      fonts.googleapis.com, which is why nothing that ships depends on it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />

    <script>
      // config.ts reads these; the demo never calls the API but the globals
      // keep any transitive import from tripping over `undefined`.
      window.__MESH_BASE_PATH__ = "";
      window.__MESH_REGISTRY_URL__ = "http://localhost:8000/api";
    </script>
    <style>
      html {
        scroll-behavior: auto;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="./scroll.tsx"></script>
  </body>
</html>
