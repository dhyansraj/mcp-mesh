# Helm values for mcp-mesh-core — TripPlanner Final Product
# Deploys: registry, PostgreSQL, Redis, Tempo, Grafana, UI
#
# Usage:
#   helm install mcp-core oci://ghcr.io/dhyansraj/mcp-mesh/mcp-mesh-core \
#     --version 3.5.2 -n trip-planner --create-namespace -f values-core.yaml

# install.sh creates the namespace with kubectl; the chart renders no Namespace
# of its own — see "Namespace handling" in the mcp-mesh-core chart README.

# All components enabled
postgres:
  enabled: true

redis:
  enabled: true

registry:
  enabled: true

grafana:
  enabled: true

tempo:
  enabled: true

ui:
  enabled: true

# Lighter resource limits for minikube
mcp-mesh-postgres:
  persistence:
    enabled: true
    size: 2Gi

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

mcp-mesh-redis:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

mcp-mesh-registry:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  registry:
    # SPIRE-based TLS for registry. spire.enabled mounts the agent socket into
    # the registry pod on its own — adding it again through extraVolumes /
    # extraVolumeMounts makes the Deployment invalid ("Duplicate value:
    # spire-agent-socket").
    security:
      tls:
        mode: "auto"
      trust:
        backend: "spire"
        spire:
          enabled: true
          socketPath: "/run/spire/agent/sockets/agent.sock"

mcp-mesh-grafana:
  grafana:
    persistence:
      enabled: false

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

mcp-mesh-tempo:
  tempo:
    persistence:
      enabled: false

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

mcp-mesh-ui:
  ui:
    registryURL: "http://mcp-core-mcp-mesh-registry:8000"
