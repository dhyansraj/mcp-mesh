# The deliberate Python dependency bump path (issue #1454).
#
# src/runtime/python/constraints.txt fixes the transitive set CI tests and the
# runtime images ship. That is the point — but a lock nobody ever moves is just
# a slow way to accumulate unpatched dependencies. This is the sanctioned way to
# move it: a re-resolution against today's PyPI, landing as its own reviewed PR
# whose CI run is the evidence that the new set is green.
#
# It replaces a job that ran `pip-compile requirements-dev.txt` and
# `pip-compile requirements-prod.txt`. Neither file has ever existed in this
# repo, so the step could only fail; nothing was being updated.
name: Dependency Updates

on:
  # Weekly, as before. The PR is a proposal — nothing merges itself, and
  # scripts/check_release_lockfiles.py is what stops one riding into a release
  # bump instead.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  update-python-lock:
    name: Re-resolve the Python lock
    runs-on: ubuntu-latest
    if: github.repository_owner == github.actor

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # No pip-tools here on purpose: the generator pins its own pip-tools and
      # runs it inside python:3.11-slim, so the result does not depend on what
      # the runner happens to have. Docker is preinstalled on ubuntu-latest.
      - name: Re-resolve constraints.txt
        run: scripts/lock_python_deps.sh --upgrade

      - name: Summarize the move
        id: summary
        run: |
          echo 'moved<<EOF' >> $GITHUB_OUTPUT
          git diff --unified=0 -- src/runtime/python/constraints.txt \
            | grep -E '^[+-][a-zA-Z0-9]' | sort >> $GITHUB_OUTPUT || true
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): re-resolve the Python dependency lock"
          title: "chore(deps): re-resolve the Python dependency lock"
          body: |
            Re-resolved `src/runtime/python/constraints.txt` against today's
            PyPI with `scripts/lock_python_deps.sh --upgrade`.

            This PR's own CI run is the acceptance test: it installs the unit
            suite against the new set, so a green wall here means the set is
            safe to adopt and a red one means an upstream release broke us —
            which is the whole reason the lock exists. Both #1312 (a FastMCP
            default-flip) and #1453 (an `openai` minor adding a required
            response field) reached us because that question was never asked
            before the versions shipped.

            ```diff
            ${{ steps.summary.outputs.moved }}
            ```

            Review the moves, not just the colour of the checks. If one of them
            is undesirable, pin it out in `packaging/pypi/pyproject.toml` and
            re-run `scripts/lock_python_deps.sh` rather than editing the lock.
          branch: chore/python-lock-refresh
          delete-branch: true
