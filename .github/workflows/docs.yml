name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'RELEASE_NOTES.md'  # included verbatim by docs/release-notes.md
      - '.github/workflows/docs.yml'
      - 'examples/tutorial/**'
      - 'scripts/generate_tutorial_artifacts.sh'
      # The homepage scroll bundle is BUILT here, not committed, so a change to
      # its source produces no diff under docs/ and would otherwise not deploy
      # — the site would keep serving the previously built bundle until some
      # unrelated docs edit happened to trigger this workflow.
      #
      # Deliberately the whole tree rather than an enumeration. The bundle
      # depends on src/ui/demo/, components/topology/AgentNode.tsx,
      # lib/topology.ts, app/globals.css, BOTH vite configs (the shipping one
      # imports its plugins from the other) AND package-lock.json; any
      # hand-maintained list eventually misses one and under-deploys silently.
      # Over-triggering costs an occasional needless docs deploy after a
      # dashboard-only change, which is harmless.
      - 'src/ui/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        # PINNED, and it matters more than it looks. The scroll section's CSS is
        # scoped against Material's own stylesheet — the isolation harness
        # vendors 9.7.1 and every specificity and cascade decision was
        # calibrated against it. A silent Material bump can change a
        # `.md-typeset` rule underneath us with no signal at deploy time: one
        # such rule (`.md-typeset svg { max-width: 100% }`) already collapsed
        # every edge in the graph to zero width during development.
        # Versions match the local .venv so CI and local render identically.
        run: |
          pip install mkdocs-material==9.7.1
          pip install mkdocs-minify-plugin==0.8.0
          pip install mkdocs-git-revision-date-localized-plugin==1.5.0

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate tutorial download artifacts
        run: bash scripts/generate_tutorial_artifacts.sh

      - name: Verify tutorial artifacts exist
        run: |
          set -e
          REQUIRED=(
            docs/downloads/day-01-scaffold.zip
            docs/downloads/day-02-dependency-injection.zip
            docs/downloads/day-03-llm-provider.zip
            docs/downloads/day-04-provider-tiers.zip
            docs/downloads/day-05-http-gateway.zip
            docs/downloads/day-06-chat-history.zip
            docs/downloads/day-07-committee.zip
            docs/downloads/day-08-docker-compose.zip
            docs/downloads/day-09-kubernetes.zip
            docs/downloads/day-10-whats-next.zip
            docs/downloads/final-product.zip
            docs/downloads/tutorial-complete.html
            docs/downloads/tutorial-complete.txt
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            if [ ! -s "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: Missing tutorial artifacts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All tutorial artifacts present."

      # Node 22 to match ci.yml's ui-test job: the two must agree, or the bundle
      # this deploys could differ from the one CI type-checks and tests.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json

      - name: Install dashboard dependencies
        working-directory: src/ui
        run: npm ci

      # The scroll bundle is built here rather than committed, so that shipping
      # a stale artifact is not possible: the bundle is generated from the beat
      # data, AgentNode and lib/topology, and a committed copy would silently
      # outlive any of them.
      #
      # It USED to be justified by size — the React build was 531KB against
      # this repo's 500KB large-file limit. The prerendered build is 185KB, so
      # that argument no longer applies and the staleness one is now doing all
      # the work. Stated explicitly because a rationale that has quietly become
      # false is worse than no rationale.
      - name: Build the homepage scroll section
        run: make docs-scroll-build

      - name: Verify the scroll bundle was produced
        run: |
          set -e
          for f in mesh-scroll.js mesh-scroll.css fonts/geist-var.woff2 fonts/geist-mono-400.woff2; do
            if [ ! -s "docs/assets/mesh-scroll/$f" ]; then
              echo "ERROR: docs/assets/mesh-scroll/$f missing or empty after build."
              echo "The homepage would deploy without its scroll section."
              exit 1
            fi
          done
          echo "Scroll bundle present."

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
