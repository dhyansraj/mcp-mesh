name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/runtime/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # `mesh` is in scope deliberately: it is the public decorator surface
      # shipped in the wheel (hatch `packages = ["_mcp_mesh", "mesh"]`), and it
      # was previously linted by nothing at all — not this job, and not
      # .pre-commit-config.yaml, which has no ruff hook by design. The three
      # directories here are every Python package under src/runtime/python.
      - name: Run ruff linting
        run: ruff check _mcp_mesh mesh tests

      - name: Run ruff formatting check
        run: ruff format --check _mcp_mesh mesh tests

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run Go tests
        run: go test ./... -v

      - name: Run Go tests with race detection
        run: go test ./... -race

  # Issue #1586: this job ran `--no-default-features` and nothing else, so
  # `ffi` — the one feature no other CI job enables — was compiled for the
  # first time by release.yml, i.e. after merge. `java-test` below runs
  # `mvn test` with no Rust step at all, so nothing on a PR built it.
  #
  # What the `ffi` feature actually gates is narrower than it sounds, and worth
  # stating so this leg is not mistaken for broader coverage than it has:
  # `src/ffi.rs` — the core Java native surface — is declared UNGATED at
  # lib.rs:89 and was already compiled (and its tests already run) by the
  # existing no-default-features leg. The feature gates exactly two things:
  # `src/jobs_ffi.rs`, the MeshJob C-ABI surface (its own `#![cfg]`, 25 tests),
  # and the cbindgen header generation in build.rs, which keys off
  # CARGO_FEATURE_FFI. Both were release-only until this leg.
  #
  # The remaining feature sets were already compiled on every PR, just not
  # here: `python` + `spire` by `python-test` (maturin, via pyproject's
  # features = ["pyo3/extension-module", "spire"]) and `typescript` + `spire` by
  # `typescript-test` (napi, via package.json's `build` script). But both of
  # those only *build* the crate; neither runs `cargo test`, so the tests behind
  # those gates never executed anywhere. That was 14 tests for `typescript`
  # alone (8 in napi.rs, 6 in jobs_napi.rs). The `typescript` and `spire` legs
  # below close that gap. To be precise about what the `spire` leg buys: it is
  # not the only thing that *compiles* spire.rs on a PR — both builds above
  # already do — it is the only thing that *runs* spire.rs's tests.
  #
  # Test counts differ per leg, which is the point — if a leg's count drops to
  # another leg's, a feature gate has stopped doing anything:
  #   488  --no-default-features
  #   513  ffi        (+25, jobs_ffi.rs)
  #   502  typescript (+14, napi.rs + jobs_napi.rs)
  #   492  spire      (+4,  spire.rs)
  # The `default` leg does not run tests; see the note on it below.
  rust-test:
    name: Rust Tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/runtime/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: no-default-features
            features: "--no-default-features"
            cmd: "cargo test --no-default-features -- --test-threads=1"
          - id: ffi
            features: "--features ffi --no-default-features"
            cmd: "cargo test --features ffi --no-default-features -- --test-threads=1"
          - id: spire
            features: "--features spire --no-default-features"
            cmd: "cargo test --features spire --no-default-features -- --test-threads=1"
          - id: typescript
            features: "--features typescript --no-default-features"
            cmd: "cargo test --features typescript --no-default-features -- --test-threads=1"
          # `cargo check`, not `cargo test`, and not a lapse. The default set is
          # `python` + `simd`, and `python` pulls pyo3 with `extension-module`
          # (Cargo.toml:28) unconditionally — which tells pyo3 to leave the
          # libpython symbols undefined for the interpreter to resolve at import
          # time. A test harness is an executable with no interpreter to resolve
          # them, so linking fails on `__Py_NoneStruct` and friends. Making it
          # link would mean either making the pyo3 feature conditional (a source
          # change) or platform-specific RUSTFLAGS, neither of which belongs in
          # a CI change. `--all-targets` still type-checks the test modules, so
          # this leg catches everything except a genuine runtime failure in a
          # `python`-gated test; those run for real in `python-test`.
          - id: default
            features: ""
            cmd: "cargo check --all-targets"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Not in the default (minimal) profile dtolnay/rust-toolchain installs.
          components: clippy

      # Two entries, deliberately. The downloaded crates are decided by
      # Cargo.lock alone — feature-independent and byte-identical across the
      # five legs — so they share one entry keyed without the matrix id. Packing
      # them per-leg would store five near-identical copies of the registry
      # against this repo's 10 GB LRU budget, on top of the `-cargo-py-` and
      # `-cargo-ts-` entries other jobs restore; the likely victim of that
      # eviction is those other jobs, not these legs.
      #
      # target/ is the part that genuinely differs per feature set, so it keeps
      # the matrix id. Note the reason is speed, not correctness: `actions/cache`
      # entries are immutable, and a save against an existing key does not
      # clobber it — it no-ops with "Cache already exists". Under one shared key
      # the first leg to finish would simply win, and the other four would
      # restore a tree whose cargo fingerprints do not match their feature set
      # and rebuild from scratch anyway.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust-registry-${{ hashFiles('src/runtime/core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: src/runtime/core/target
          key: ${{ runner.os }}-cargo-rust-target-${{ matrix.id }}-${{ hashFiles('src/runtime/core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-target-${{ matrix.id }}-

      - name: Run Rust tests
        run: ${{ matrix.cmd }}

      # ADVISORY, NOT A GATE — `continue-on-error: true` and no `-D warnings`.
      # The crate has 26-45 style warnings depending on the feature set, most of
      # them the dead code issue #1594 removes. Gating on them today would mean
      # either a red wall on every PR or turning this CI change into a Rust
      # cleanup. Once #1594 lands, drop `continue-on-error` and append
      # `-- -D warnings` here; until then this exists so the count is visible in
      # the log and a *new* warning is at least readable in the diff of a run.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy ${{ matrix.features }} --all-targets

  typescript-test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/runtime/typescript/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/runtime/core/target
          key: ${{ runner.os }}-cargo-ts-${{ hashFiles('src/runtime/core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ts-

      - name: Build @mcpmesh/core native module
        working-directory: src/runtime/core/typescript
        run: |
          npm install
          npm run build

      - name: Install TypeScript SDK dependencies
        working-directory: src/runtime/typescript
        run: npm install

      - name: Type check TypeScript SDK (Express 4 + 5)
        working-directory: src/runtime/typescript
        run: npm run typecheck:all

      - name: Run TypeScript tests
        working-directory: src/runtime/typescript
        run: npm test

  ui-test:
    name: UI Dashboard Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      # REQUIRED BEFORE tsc, not optional tidiness. demo/static.ts imports
      # demo/generated/graph.json, which is a build artifact and gitignored (it
      # is 150 kB of rendered markup and would otherwise be scanned by Tailwind
      # into the dashboard's own stylesheet). tsconfig includes **/*.ts and
      # excludes only node_modules and dist, so on a fresh checkout — which is
      # exactly what CI is — `tsc --noEmit` fails with TS2307 until this has run.
      #
      # It also happens to be the cheapest useful guard we have. No browser, no
      # Playwright: esbuild plus one node process, a couple of seconds. It
      # re-renders the real <Stage> and fails the build if the edge geometry
      # disagrees with the captured fixture (36 paths across 2 states), if
      # AgentNode's markup has drifted from the card table the driver swaps in,
      # or if any selector the driver queries has gone missing from the shell.
      # That last one is the difference between a red PR and shipping an empty
      # dark panel over 2205vh of scroll.
      #
      # The full equivalence capture (demo/equivalence.mjs) stays OUT of CI: it
      # needs two browser runs against a served build, and its React reference
      # bundle is a 531 kB build of its own. It is a local gate for changes to
      # this section, not a per-PR check.
      - name: Prerender the scroll section (also its build-time guards)
        working-directory: ${{ github.workspace }}
        run: make docs-scroll-prerender

      # The one artifact of that step that is COMMITTED rather than ignored:
      # src/ui/demo/copy.generated.html, which docs/index.md includes with
      # pymdownx.snippets so the section's prose is in the served document.
      # It has to be committed (check_paths makes a missing snippet a hard docs
      # build failure, and product prose belongs in a diff where it can be read)
      # which means it can be stale, which is what this catches. Regenerating is
      # `make docs-scroll-prerender`.
      - name: The served copy is in step with the beat data
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- src/ui/demo/copy.generated.html; then
            echo ""
            echo "ERROR: src/ui/demo/copy.generated.html is stale."
            echo "demo/script.ts changed without regenerating the copy the docs"
            echo "page serves. Run 'make docs-scroll-prerender' and commit the result."
            exit 1
          fi

      - name: Type check dashboard
        run: npx tsc --noEmit

      - name: Run dashboard tests
        run: npm test

  java-test:
    name: Java Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/runtime/java
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          cache-dependency-path: src/runtime/java/**/pom.xml

      - name: Run Java tests
        run: mvn test --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: src/runtime/java/**/target/surefire-reports/*.xml

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/runtime/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        test-group: ["unit"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/runtime/core/target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('src/runtime/core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-

      - name: Build and install mcp_mesh_core
        run: |
          pip install maturin
          cd ../core
          # Remove any stale wheels to ensure we install the freshly built one
          rm -f target/wheels/*.whl
          maturin build --release
          pip install target/wheels/*.whl

      # Issue #1454: installed against constraints.txt, the dependency lock, so
      # this job tests the same transitive set the runtime images ship and a
      # rebuild of a given commit gets. Previously pip resolved at job time,
      # which is how PR #1453's Responses streaming tests passed on a laptop
      # holding openai 2.14.0 and failed in CI on 2.52.0 — a *minor* that had
      # added a required field to InputTokensDetails.
      #
      # `-c` constrains without installing, so this still installs exactly
      # `.[dev]` — including litellm, which [dev] pulls via mcp-mesh[litellm]
      # and which the lock therefore covers. If the lock and the manifest ever
      # disagree (a floor raised past a pin, say), pip fails here loudly on
      # every PR rather than at release time.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] -c constraints.txt
          python -c "import openai, fastmcp; print('openai', openai.__version__, '| fastmcp', fastmcp.__version__)"

      - name: Run unit tests
        if: matrix.test-group == 'unit'
        env:
          MCP_MESH_AUTO_RUN: false
        run: |
          pytest tests/unit/ _mcp_mesh/ -v \
            --cov=_mcp_mesh \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=test-results-unit-${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-group }}-${{ matrix.python-version }}
          path: test-results-*.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test-group }}
          name: codecov-${{ matrix.test-group }}
          fail_ci_if_error: false

      # Issue #1387/#1389/#1396: @mesh.route route handling is the one place
      # mesh reads and rebuilds FastAPI's own route state, so it is the one
      # place a FastAPI release can break us. Testing a single resolved FastAPI
      # is how 0.140.5 shipped as a silent SSE-to-JSON degradation, and how
      # 0.137.0's include_router() change shipped as silently-undiscovered
      # routes. The run above uses whatever pip resolves (latest); re-run the
      # route files against an older FastAPI so both ends of the supported
      # range are covered — 0.135.0 still flattens included routers (lazy
      # `original_router` lands in 0.137.0), latest does not, and the same code
      # must handle both.
      #
      # Issue #1409: the pin is the DECLARED FLOOR, not a version near it. It
      # used to sit at 0.136.1 while the manifests declared >=0.135.0, so the
      # lowest version a user could legally install was below the lowest one
      # CI exercised — the same supported-on-paper/untested-in-CI band #1402
      # fixed, and the band where the attributes the route rebuild keys off are
      # half-present (is_json_stream lands in 0.134.0, is_sse_stream in
      # 0.135.0). scripts/test_ci_fastapi_floor.py asserts this literal equals
      # the manifest floor, so the two cannot drift apart again.
      #
      # Deliberately installed WITHOUT `-c constraints.txt` (#1454): the lock
      # pins the FastAPI the suite normally runs on, and the entire purpose of
      # this step is to leave it. The lock covers "the set we ship"; this covers
      # "the oldest set we claim to support".
      # Runs last so it cannot perturb coverage/test-result artifacts.
      - name: Route integration tests against older FastAPI
        if: matrix.test-group == 'unit' && matrix.python-version == '3.11'
        env:
          MCP_MESH_AUTO_RUN: false
        run: |
          python -c "import fastapi; print('resolved fastapi:', fastapi.__version__)"
          pip install "fastapi==0.135.0"
          python -c "import fastapi; print('pinned fastapi:', fastapi.__version__)"
          pytest tests/unit/test_route_sse_wrapping.py \
            tests/unit/test_route_include_router_1396.py \
            tests/unit/test_sse_strips_mcp_mesh_tool_params.py \
            tests/unit/test_stream_settle.py -q

  # Issue #1399: scripts/test_bump_version.py was referenced by nothing — not a
  # workflow, not the Makefile, not the docs. It is the only regression net for
  # two defect classes bump_version.py's own guards structurally cannot see
  # (prefix corruption of our own pins, and provenance prose being rewritten),
  # and the guards it covers only run during a release bump. So a weakened guard
  # would have surfaced at the same moment #1379 did: mid-release.
  #
  # Discovers the whole directory rather than naming one file, so the next
  # scripts/test_*.py is enforced the day it lands instead of the day someone
  # remembers to add a line here. It is stdlib-only and finishes in well under a
  # second; the job cost is almost entirely the Python setup.
  scripts-test:
    name: Repo Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML because the chart guards parse rendered manifests, and pytest
      # imports their test modules to collect them — without it the whole
      # directory fails at collection rather than one file. Pinned to the
      # version the helm-charts job installs so both jobs parse identically.
      # This job deliberately has no helm: the chart guards' tests are mostly
      # pure functions over parsed manifests and run here, while their few
      # end-to-end cases skip and are covered for real in helm-charts.
      - name: Install pytest
        run: pip install pytest pyyaml==6.0.3

      - name: Run scripts/ tests
        run: python3 -m pytest scripts/ -v

      # The file documents `python scripts/test_bump_version.py` as a supported
      # entry point, and that __main__ runner collects tests by a different rule
      # than pytest does. Run it too so it cannot rot into a no-op.
      - name: Run the direct entry point
        run: python3 scripts/test_bump_version.py

      # Issue #1500: the man pages and docs/ assert things about the four
      # runtimes and nothing connected them, so #1499 shipped three false
      # Actuator claims — one of them a `curl` that 404s — through a fully
      # green build. The check runs here rather than in a docs job because its
      # evidence is source: Go/Python/TypeScript/Java route registrations, the
      # starter's POM, and the probe handlers themselves. Stdlib only, under a
      # second. Its own tests are collected by the pytest step above.
      - name: Check doc claims against the code they describe
        run: python3 scripts/check_doc_claims.py

  # Issue #1407: a version bump must not re-resolve the Rust dependency graph.
  # The bump reminder used to say `cargo generate-lockfile`, which does exactly
  # that, so v3.2.3 and v3.3.1 each shipped six third-party crate moves — the
  # napi chain and cc among them, which rebuild the native module — while
  # v3.3.1's notes claimed byte-for-byte identical runtime behavior. Neither
  # bump guard can see it: both only inspect lines carrying the mesh version,
  # and the churn hides inside a ~450-file release diff.
  #
  # The gate fires only when mcp-mesh-core's own version moved, i.e. on a
  # release-bump PR. A PR that deliberately bumps Rust dependencies — a fine
  # thing to do as its own reviewed change — leaves our version alone and is
  # skipped, so this cannot become a check people route around.
  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs the base branch, so it needs history.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert the bump moved only mesh versions in the lockfiles
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD^"
          fi
          python3 scripts/check_release_lockfiles.py --base "$BASE"

  # Issue #1421: helm lint and the PSS render used to run in exactly one place —
  # helm-release.yml, on a `v*` tag — so a chart change met its first automated
  # check during the release that published it. Six chart PRs merged with green
  # walls containing zero chart validation; every defect in them was caught by
  # hand.
  #
  # No `paths:` filter, deliberately. The job takes under a minute, and a
  # skipped job reports the same green check as a passing one — a status wall
  # that cannot distinguish "validated" from "not looked at" is the exact
  # failure this job exists to fix. A filter would also have to enumerate every
  # input to the render (helm/**, observability/grafana/dashboards/**, and the
  # scripts/ checkers themselves), and would go quietly inert the day something
  # new feeds the render and nobody updates the list.
  helm-charts:
    name: Helm Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The render diff needs the merge base, so it needs history and the
          # base branch ref.
          fetch-depth: 0

      # Same version helm-release.yml packages with: this job is only worth
      # having if it renders what the release will render.
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.3

      # Mirrors helm-release.yml. The dashboard ConfigMap only renders when the
      # JSON is present, so without this step CI would validate a variant of the
      # chart that is never released.
      - name: Sync observability configs to Helm charts
        run: |
          mkdir -p helm/mcp-mesh-grafana/files/dashboards
          cp observability/grafana/dashboards/*.json \
             helm/mcp-mesh-grafana/files/dashboards/
          ls -la helm/mcp-mesh-grafana/files/dashboards/

      # helm/*/charts/*.tgz is gitignored, so a fresh checkout has no subchart
      # archives at all and the umbrella cannot render until they are built.
      - name: Update Helm chart dependencies
        run: helm dependency update helm/mcp-mesh-core

      - name: Lint Helm charts
        run: |
          for chart in helm/mcp-mesh-*; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart"
            fi
          done

      # lint parses templates; it says nothing about what they render. This
      # renders every chart and asserts the PSS "restricted" profile, which is
      # what catches valid-but-wrong YAML.
      - name: Check Pod Security Standards compliance
        run: python3 scripts/check_helm_pss.py

      # ...and the PSS check renders defaults only. Template-time guards are
      # inert on the default path by construction, so a deleted or inverted
      # guard stays green through both steps above. This one renders each
      # guard's fail path and the pass path next to it.
      - name: Render chart guards with non-default values
        run: python3 scripts/check_helm_render_matrix.py

      # Both steps above assert things about a single render. #1461 was a
      # defect *between* two renders: a volume that kept its name while
      # changing type, which server-side apply can merge into an object the
      # API server rejects. Nothing that renders one state at a time can see
      # it. This one renders each persistence toggle in every state and
      # compares them. (It still cannot see field-manager ownership — see the
      # script header.)
      - name: Check volume names carry volume types
        run: python3 scripts/check_helm_volume_keys.py

      # Reviewer aid, not a gate — see the header of the script for why CI
      # cannot decide whether a chart delta is intended.
      - name: Diff the rendered umbrella against the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD^"
          fi
          scripts/helm_render_diff.sh "$BASE" | tee /tmp/render-diff.txt
          {
            echo '### Rendered umbrella diff'
            echo
            echo '```diff'
            head -n 400 /tmp/render-diff.txt
            if [ "$(wc -l < /tmp/render-diff.txt)" -gt 400 ]; then
              echo "... truncated; see the step log for the full diff"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src/runtime/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r _mcp_mesh/ -f json -o bandit-report.json || true
          bandit -r _mcp_mesh/ -f txt || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json

  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [python-test, go-test, rust-test, typescript-test, java-test]
    defaults:
      run:
        working-directory: packaging/pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatch

      - name: Prepare packaging files
        working-directory: packaging/pypi
        run: |
          cp ../../src/runtime/python/README.md .
          cp ../../LICENSE .
          cp -r ../../src/runtime/python/_mcp_mesh .
          cp -r ../../src/runtime/python/mesh .

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

  integration-status:
    name: Integration Status
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        python-test,
        go-test,
        rust-test,
        typescript-test,
        java-test,
        ui-test,
        scripts-test,
        lockfile-integrity,
        helm-charts,
        build-and-package,
      ]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Lint and Format: ${{ needs.lint-and-format.result }}"
          echo "Python Tests: ${{ needs.python-test.result }}"
          echo "Go Tests: ${{ needs.go-test.result }}"
          echo "Rust Tests: ${{ needs.rust-test.result }}"
          echo "TypeScript Tests: ${{ needs.typescript-test.result }}"
          echo "Java Tests: ${{ needs.java-test.result }}"
          echo "UI Dashboard Tests: ${{ needs.ui-test.result }}"
          echo "Repo Script Tests: ${{ needs.scripts-test.result }}"
          echo "Lockfile Integrity: ${{ needs.lockfile-integrity.result }}"
          echo "Helm Charts: ${{ needs.helm-charts.result }}"
          echo "Build and Package: ${{ needs.build-and-package.result }}"

          # Every job in needs: must have succeeded for the pipeline to pass.
          #
          # security-scan is deliberately NOT gated and deliberately NOT in
          # needs:. Two independent reasons: it runs `bandit ... || true` twice,
          # so it reports success regardless of findings and could only ever
          # fail on infrastructure trouble; and it is guarded by
          # `if: github.event_name == 'push' || workflow_dispatch`, so on the
          # pull_request events this gate exists to serve its result is
          # `skipped` — adding it to the condition above would fail every single
          # PR. It is an artifact-producing advisory job; the message below says
          # so rather than claiming coverage this step does not have.
          if [[ "${{ needs.lint-and-format.result }}" != "success" ]] || \
             [[ "${{ needs.python-test.result }}" != "success" ]] || \
             [[ "${{ needs.go-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.typescript-test.result }}" != "success" ]] || \
             [[ "${{ needs.java-test.result }}" != "success" ]] || \
             [[ "${{ needs.ui-test.result }}" != "success" ]] || \
             [[ "${{ needs.scripts-test.result }}" != "success" ]] || \
             [[ "${{ needs.lockfile-integrity.result }}" != "success" ]] || \
             [[ "${{ needs.helm-charts.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-package.result }}" != "success" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ All gating CI checks passed"
            echo "ℹ️  Security Scanning is advisory and not gated here — read its report artifact"
          fi
