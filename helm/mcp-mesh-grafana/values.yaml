grafana:
  enabled: true
  image:
    # Registry prefix for the image. Resolution: this value >
    # global.imageRegistry > "" (Docker Hub). The repository path is
    # preserved (registry: my.registry.internal pulls
    # my.registry.internal/grafana/grafana).
    registry: ""
    repository: grafana/grafana
    tag: "12.3.1"
    pullPolicy: IfNotPresent

  # Pull secrets for this chart's pods, merged with global.imagePullSecrets
  # (deduplicated by name). Standard shape:
  #   imagePullSecrets:
  #     - name: my-registry-credentials
  imagePullSecrets: []

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Deployment update strategy. Empty leaves the field unset, so Kubernetes
  # applies its own default (RollingUpdate).
  #
  # On a multi-node cluster you almost certainly want Recreate here, because
  # this chart runs a single replica against the ReadWriteOnce volume above.
  # RollingUpdate starts the incoming pod before the outgoing one is gone; if
  # the scheduler places it on another node it cannot mount a ReadWriteOnce
  # claim the outgoing pod still holds, and the rollout deadlocks until someone
  # deletes the old pod. Both pods landing on one node is why single-node dev
  # clusters never see this — and in that case it is still wrong, because two
  # Grafana processes would write the same SQLite database. With replicas fixed
  # at 1 there is no availability to preserve either way, so Recreate costs
  # only a gap in dashboards while the old pod terminates.
  #
  # It is not the default because switching an already-installed release from
  # RollingUpdate to Recreate is rejected by the API server, which defaulted
  # .spec.strategy.rollingUpdate on the live object: rollingUpdate "may not be
  # specified when strategy `type` is 'Recreate'". Under Helm 4 the default
  # server-side apply does not clear it and --force-conflicts does not help, so
  # run that one switch with `helm upgrade --server-side=false`; Helm 3 patches
  # client-side and needs no flag. Deleting the Deployment and letting Helm
  # recreate it also works. Setting it at install time avoids all of this.
  strategy: {}
    # type: Recreate

  service:
    type: ClusterIP
    port: 3000

  config:
    # Password for the built-in "admin" user. Resolution order:
    #   1. existingSecret below (no plaintext in values)
    #   2. this value (rendered into the chart-managed Secret)
    #   3. empty: auto-generated into the chart-managed Secret
    #      "<fullname>-secret" (key: admin-password). The generated value is
    #      reused on helm upgrade (lookup) and never deleted by Helm
    #      (helm.sh/resource-policy: keep), so it stays the record of the
    #      password Grafana persisted on first start. Retrieve it with:
    #        kubectl get secret <fullname>-secret -o jsonpath='{.data.admin-password}' | base64 -d
    #      Note: lookup needs a cluster — `helm template | kubectl apply` and
    #      GitOps renderers (Argo CD, Flux) regenerate the value on every
    #      render, which surfaces as permanent drift on the Secret. Use helm
    #      install/upgrade there, or set existingSecret (+ generatedSecret:
    #      false) — see below.
    #      Grafana applies the password only on first start: with persistence
    #      enabled, later changes to this value do not update a provisioned
    #      instance (use grafana-cli admin reset-admin-password).
    adminPassword: ""
    # Read the admin password from an existing secret instead. The chart then
    # renders no Secret of its own and the Deployment reads
    # GF_SECURITY_ADMIN_PASSWORD from this one via secretKeyRef — the
    # render-stable option, and the recommended setting for GitOps.
    #
    # Adopting it on an EXISTING install is a TWO-step change. Grafana honours
    # the password only on first start, so with persistence enabled the
    # effective password stays the one in "<fullname>-secret" — read it and
    # seal it into the new secret. And do not combine the chart upgrade with
    # setting existingSecret: helm.sh/resource-policy: keep is read off the
    # live object, so on a release from a chart that predates it the same
    # upgrade would delete "<fullname>-secret" and that password with it.
    # Upgrade first (check the annotation is on the live secret), adopt second.
    # To switch to a different password, change it in Grafana afterwards
    # (grafana-cli admin reset-admin-password) or reprovision from an empty
    # PVC — see the mcp-mesh-core README for the ordering.
    existingSecret: ""
    existingSecretPasswordKey: "admin-password"
    # Auto-generate the admin password when neither adminPassword nor
    # existingSecret is set. Setting false makes the chart refuse to invent
    # one: templating fails with a message naming both options instead of
    # emitting a Secret whose value changes on every render. That is the
    # GitOps-safe posture — set it once alongside existingSecret and no
    # renderer can silently rotate the password.
    generatedSecret: true
    allowSignUp: false
    installPlugins: "grafana-piechart-panel"
    # Base path for serving Grafana behind a path prefix
    # When set, configures root_url and serve_from_sub_path in grafana.ini
    basePath: ""

  datasources:
    tempo:
      enabled: true
      url: 'http://{{ include "mcp-mesh-core.fullname" . }}-tempo:3200'
    prometheus:
      enabled: true
      url: "http://prometheus:9090"

  # Dashboard configuration references observability/grafana/dashboards/
  dashboards:
    enabled: true
    # References to the centralized dashboard configs
    configMaps:
      - mcp-mesh-dashboards

  # Pod security context (hardened for Pod Security Standards "restricted").
  # Renamed: this key was previously called securityContext (which is now the
  # container security context below) — templating fails with a migration
  # message if an old-shaped override still carries pod-level fields there.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472 # grafana user in the grafana/grafana image
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  # Container security context. readOnlyRootFilesystem works because every
  # path Grafana writes is a volume: /var/lib/grafana (data, sqlite db,
  # GF_INSTALL_PLUGINS target — PVC or emptyDir) and /tmp (emptyDir, plugin
  # download scratch); logs go to console (see grafana.ini in the configmap).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
