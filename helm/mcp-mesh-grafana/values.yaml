grafana:
  enabled: true
  image:
    # Registry prefix for the image. Resolution: this value >
    # global.imageRegistry > "" (Docker Hub). The repository path is
    # preserved (registry: my.registry.internal pulls
    # my.registry.internal/grafana/grafana).
    registry: ""
    repository: grafana/grafana
    tag: "12.3.1"
    pullPolicy: IfNotPresent

  # Pull secrets for this chart's pods, merged with global.imagePullSecrets
  # (deduplicated by name). Standard shape:
  #   imagePullSecrets:
  #     - name: my-registry-credentials
  imagePullSecrets: []

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Persistent storage for /var/lib/grafana (grafana.db). Enabled by default, so
  # dashboards, annotations, users, and API keys authored in the UI survive a
  # pod restart. Disable it and Grafana runs on an emptyDir: the provisioned
  # datasources and ConfigMap dashboards still come back, everything authored
  # in the UI does not.
  #
  # The claim carries "helm.sh/resource-policy": keep, so `helm uninstall` does
  # NOT delete it and does NOT reclaim the storage — a volume enabled by default
  # is not something an uninstall should discard silently, and the admin-password
  # Secret in this chart is kept for the same reason. Reinstalling under the same
  # release name adopts the existing claim with its data intact. To reclaim the
  # storage, delete the claim yourself (the annotation only stops Helm):
  #   kubectl delete pvc <release>-mcp-mesh-grafana-pvc -n <namespace>
  # Scale the Deployment to 0 first — the delete otherwise blocks on the
  # pvc-protection finalizer while a pod has the volume mounted.
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Deployment update strategy. Empty gets the chart's default: RollingUpdate
  # with maxSurge: 0 and maxUnavailable: 1, which terminates the outgoing pod
  # before scheduling its replacement. That ordering is required, not tuning —
  # this chart runs a single replica against the ReadWriteOnce volume above, and
  # with any maxSurge the incoming pod can be scheduled to another node, where
  # it hangs indefinitely on a Multi-Attach error waiting for a claim the
  # outgoing pod still holds. On a single-node cluster it mounts instead, which
  # is worse rather than better: two Grafana processes briefly write the same
  # SQLite database. At one replica there is no availability to preserve, so the
  # only cost of ordering the swap is a gap in dashboards while the old pod
  # terminates. `type: Recreate` is redundant here — maxSurge: 0 already orders
  # the swap, and leaving type as RollingUpdate keeps .spec.strategy freely
  # transitionable on later upgrades.
  #
  # Expect one transient FailedAttachVolume/Multi-Attach event per pod-template
  # change: Kubernetes issues the scale-down and the scale-up in the same
  # second, so the replacement is created while the CSI driver is still
  # detaching the volume from the old node. It clears once the detach completes
  # — under a minute in practice, bounded by terminationGracePeriodSeconds plus
  # detach time — and the rollout converges with no intervention. The event is
  # logged, not silent.
  #
  # Overrides are deep-merged into the above, so set only the keys you mean to
  # change. Note that maxUnavailable must stay non-zero while maxSurge is 0:
  # the API server rejects both being 0.
  strategy: {}

  service:
    type: ClusterIP
    port: 3000

  config:
    # Password for the built-in "admin" user. Resolution order:
    #   1. existingSecret below (no plaintext in values)
    #   2. this value (rendered into the chart-managed Secret)
    #   3. empty: auto-generated into the chart-managed Secret
    #      "<fullname>-secret" (key: admin-password). The generated value is
    #      reused on helm upgrade (lookup) and never deleted by Helm
    #      (helm.sh/resource-policy: keep), so it stays the record of the
    #      password Grafana persisted on first start. Retrieve it with:
    #        kubectl get secret <fullname>-secret -o jsonpath='{.data.admin-password}' | base64 -d
    #      Note: lookup needs a cluster — `helm template | kubectl apply` and
    #      GitOps renderers (Argo CD, Flux) regenerate the value on every
    #      render, which surfaces as permanent drift on the Secret. Use helm
    #      install/upgrade there, or set existingSecret (+ generatedSecret:
    #      false) — see below.
    #      Grafana applies the password only on first start: with persistence
    #      enabled, later changes to this value do not update a provisioned
    #      instance (use grafana-cli admin reset-admin-password).
    adminPassword: ""
    # Read the admin password from an existing secret instead. The chart then
    # renders no Secret of its own and the Deployment reads
    # GF_SECURITY_ADMIN_PASSWORD from this one via secretKeyRef — the
    # render-stable option, and the recommended setting for GitOps.
    #
    # Adopting it on an EXISTING install is a TWO-step change. Grafana honours
    # the password only on first start, so with persistence enabled the
    # effective password stays the one in "<fullname>-secret" — read it and
    # seal it into the new secret. And do not combine the chart upgrade with
    # setting existingSecret: helm.sh/resource-policy: keep is read off the
    # live object, so on a release from a chart that predates it the same
    # upgrade would delete "<fullname>-secret" and that password with it.
    # Upgrade first (check the annotation is on the live secret), adopt second.
    # To switch to a different password, change it in Grafana afterwards
    # (grafana-cli admin reset-admin-password) or reprovision from an empty
    # volume. Reprovisioning means deleting the claim explicitly — scale the
    # Deployment to 0, `kubectl delete pvc`, then upgrade; uninstall/reinstall
    # does NOT do it, because the claim carries resource-policy: keep and the
    # reinstall adopts the old database (and with it the old password). See the
    # mcp-mesh-core README for the exact ordering.
    existingSecret: ""
    existingSecretPasswordKey: "admin-password"
    # Auto-generate the admin password when neither adminPassword nor
    # existingSecret is set. Setting false makes the chart refuse to invent
    # one: templating fails with a message naming both options instead of
    # emitting a Secret whose value changes on every render. That is the
    # GitOps-safe posture — set it once alongside existingSecret and no
    # renderer can silently rotate the password.
    generatedSecret: true
    allowSignUp: false
    installPlugins: "grafana-piechart-panel"
    # Base path for serving Grafana behind a path prefix
    # When set, configures root_url and serve_from_sub_path in grafana.ini
    basePath: ""

  datasources:
    tempo:
      enabled: true
      url: 'http://{{ include "mcp-mesh-core.fullname" . }}-tempo:3200'
    prometheus:
      enabled: true
      url: "http://prometheus:9090"

  # Provision the bundled MCP Mesh dashboards into Grafana (a ConfigMap holding
  # the JSON, plus a file provider pointing Grafana at it).
  #
  # The dashboard JSON lives in this chart's files/dashboards/, which is copied
  # from observability/grafana/dashboards/ by the release workflow and is NOT in
  # source control — so a released chart has it and a source checkout does not.
  # With the JSON absent, dashboards stay off no matter what this flag says: the
  # ConfigMaps, the mounts and the default home dashboard all drop out together
  # and Grafana starts normally without them (previously the mount stayed
  # behind and the pod never started at all). Everything else — datasources,
  # persistence, the admin password — is unaffected either way.
  #
  # To provision them from a checkout:
  #   mkdir -p helm/mcp-mesh-grafana/files/dashboards
  #   cp observability/grafana/dashboards/*.json helm/mcp-mesh-grafana/files/dashboards/
  dashboards:
    enabled: true

  # Pod security context (hardened for Pod Security Standards "restricted").
  # Renamed: this key was previously called securityContext (which is now the
  # container security context below) — templating fails with a migration
  # message if an old-shaped override still carries pod-level fields there.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472 # grafana user in the grafana/grafana image
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  # Container security context. readOnlyRootFilesystem works because every
  # path Grafana writes is a volume: /var/lib/grafana (data, sqlite db,
  # GF_INSTALL_PLUGINS target — PVC or emptyDir) and /tmp (emptyDir, plugin
  # download scratch); logs go to console (see grafana.ini in the configmap).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
