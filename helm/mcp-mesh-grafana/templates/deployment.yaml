{{- if .Values.grafana.enabled }}
{{- include "mcp-mesh-grafana.validateCredentialSource" . -}}
{{- include "mcp-mesh-grafana.validateNoRemovedKeys" . -}}
{{- /* Migration guard: grafana.securityContext used to be the POD security
       context (it carried fsGroup). It is now the CONTAINER security context
       and pod-level settings live under grafana.podSecurityContext — an old
       override here would put fsGroup in the container context, where the
       API server drops it (losing PVC write access). */}}
{{- range $field := list "fsGroup" "fsGroupChangePolicy" "supplementalGroups" "sysctls" }}
{{- if hasKey ($.Values.grafana.securityContext | default dict) $field }}
{{- fail (printf "grafana.securityContext.%s: grafana.securityContext is now the container security context; pod-only fields (fsGroup, fsGroupChangePolicy, supplementalGroups, sysctls) are invalid there and belong in grafana.podSecurityContext. Move your override there." $field) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-mesh-grafana.fullname" . }}
  labels:
    {{- include "mcp-mesh-grafana.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- /* One replica against a ReadWriteOnce claim: the incoming pod must not
         start before the outgoing one has released the volume, or it hangs on
         Multi-Attach when the scheduler picks another node. maxSurge: 0 gets
         that ordering while leaving type as RollingUpdate, so there is no
         API-defaulted .rollingUpdate block to clear on upgrade (which is what
         makes a switch to Recreate fail). Defaults are derived here rather
         than in values.yaml because strategy is deep-merged: an operator who
         sets only type would otherwise inherit rollingUpdate too and be
         rejected with "may not be specified when strategy `type` is
         'Recreate'". */}}
  {{- $st := .Values.grafana.strategy | default dict }}
  {{- $type := $st.type | default "RollingUpdate" }}
  strategy:
    type: {{ $type }}
    {{- if eq $type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ dig "rollingUpdate" "maxSurge" 0 $st }}
      maxUnavailable: {{ dig "rollingUpdate" "maxUnavailable" 1 $st }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-mesh-grafana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-mesh-grafana.selectorLabels" . | nindent 8 }}
    spec:
      {{- with include "mcp-mesh-grafana.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.grafana.podSecurityContext | nindent 8 }}
      containers:
      - name: grafana
        image: "{{ include "mcp-mesh-grafana.image" . }}"
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.grafana.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        {{- if .Values.grafana.config.existingSecret }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.config.existingSecret }}
              key: {{ .Values.grafana.config.existingSecretPasswordKey | default "admin-password" }}
        {{- else }}
        {{- /* Chart-managed Secret (explicit or auto-generated password, see
               secret.yaml) — never templated into the pod spec. */}}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-mesh-grafana.secretName" . }}
              key: admin-password
        {{- end }}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: {{ .Values.grafana.config.allowSignUp | quote }}
        {{- if .Values.grafana.config.installPlugins }}
        - name: GF_INSTALL_PLUGINS
          value: {{ .Values.grafana.config.installPlugins | quote }}
        {{- end }}
        - name: GF_NEWS_NEWS_FEED_ENABLED
          value: "false"
        {{- if .Values.grafana.config.basePath }}
        - name: GF_SERVER_ROOT_URL
          value: "%(protocol)s://%(domain)s{{ .Values.grafana.config.basePath }}/"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        {{- if include "mcp-mesh-grafana.dashboardsEnabled" . }}
        - name: dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        {{- end }}
        {{- /* /var/lib/grafana and /tmp must be writable (data, sqlite db,
               plugin install) — always volumes since the root filesystem is
               read-only. */}}
        - name: storage
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.grafana.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "mcp-mesh-grafana.fullname" . }}-config
      - name: datasources
        configMap:
          name: {{ include "mcp-mesh-grafana.fullname" . }}-datasources
      {{- /* Gated on dashboardsEnabled, NOT on grafana.dashboards.enabled: both
             ConfigMaps below are conditional on the dashboard JSON being
             present, and a volume whose backing object may not render blocks
             the pod in the kubelet forever. See the helper. */}}
      {{- if include "mcp-mesh-grafana.dashboardsEnabled" . }}
      - name: dashboards-config
        configMap:
          name: {{ include "mcp-mesh-grafana.fullname" . }}-dashboards-config
      - name: dashboards
        configMap:
          name: {{ include "mcp-mesh-grafana.fullname" . }}-dashboard
      {{- end }}
      - name: storage
        {{- if .Values.grafana.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "mcp-mesh-grafana.fullname" . }}-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp
        emptyDir: {}
{{- end }}
