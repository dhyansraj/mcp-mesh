{{- /*
Chart-managed Secret for the Grafana admin password. Renders whenever no
existing secret supplies it. Holds either the explicit
grafana.config.adminPassword (always wins) or an auto-generated one: an
existing Secret found via lookup is reused so the password stays stable
across helm upgrades; otherwise a random one is generated (first install, and
template/lint time where lookup returns nothing).

helm install/upgrade is the supported path for generated mode: without a
cluster connection lookup returns nothing, so `helm template | kubectl apply`
and GitOps renderers (Argo CD, Flux) produce a NEW password on every render —
permanent unresolvable drift on this object, and syncing it rotates the
password. Those pipelines want grafana.config.existingSecret (this template
then renders nothing), ideally with grafana.config.generatedSecret=false so a
lost reference fails the render instead of silently resuming generation.

helm.sh/resource-policy: keep — grafana.persistence.enabled defaults to true
and Grafana applies GF_SECURITY_ADMIN_PASSWORD only on FIRST start, so the
live password lives in the persisted grafana.db and this Secret is the only
record of it. Without the annotation, the moment the Secret stops being
rendered Helm deletes it: setting existingSecret on a running release (the
GitOps migration) drops the generated password in the same upgrade that
introduces the new one — which Grafana ignores, because the database is
already provisioned. That is an admin lockout recoverable only by
`grafana-cli admin reset-admin-password` or resetting the volume. Keeping the
Secret leaves the effective password retrievable, and on reinstall under the
same release name lookup finds it again (Helm adopts the kept Secret) so a
retained volume keeps matching.

The annotation cannot protect the upgrade that installs it: Helm reads the
policy off the live object (and the previous release's stored manifest), both
annotation-free on a release from an earlier chart. So a single upgrade that
bumps the chart AND sets existingSecret still deletes the generated Secret —
exactly the lockout above. Such a release must upgrade first (annotation lands,
Secret unchanged), then adopt existingSecret in a second step, after reading
the current password out of this Secret.
*/ -}}
{{- if and .Values.grafana.enabled (not .Values.grafana.config.existingSecret) }}
{{- $name := include "mcp-mesh-grafana.secretName" . }}
{{- $passwordB64 := "" }}
{{- with .Values.grafana.config.adminPassword }}
{{- $passwordB64 = . | b64enc }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $passwordB64 = dig "data" "admin-password" "" ($existing | default dict) }}
{{- if not $passwordB64 }}
{{- $passwordB64 = randAlphaNum 24 | b64enc }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-mesh-grafana.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  admin-password: {{ $passwordB64 | quote }}
{{- end }}
