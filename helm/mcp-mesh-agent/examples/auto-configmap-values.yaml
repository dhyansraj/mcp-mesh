# Example: chart-rendered ConfigMap from agentCode.scriptPath
# Renders scripts/demo-agent.py (a file inside this chart directory) into the
# ConfigMap "<fullname>-code" under the key agent.py, mounts it at
# agentCode.mountPath and runs it on the stock Python runtime image. Needs a
# local copy of the chart: .Files.Get cannot read outside the chart directory.
#
#   helm install demo-agent ./helm/mcp-mesh-agent -n mcp-mesh \
#     -f ./helm/mcp-mesh-agent/examples/auto-configmap-values.yaml
#
# The agent's name, version and capabilities come from the script's decorators.

agentCode:
  enabled: true
  # Script path relative to the chart root
  scriptPath: "scripts/demo-agent.py"
  mountPath: "/app/agent"

agent:
  # The runtime image's entrypoint is python with no script, so name it here.
  command: ["python", "/app/agent/agent.py"]

# Registry connection (host empty defaults to
# "<global.coreReleaseName>-mcp-mesh-registry")
registry:
  host: ""
  port: "8000"

# image stays at the chart default, mcpmesh/python-runtime

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
