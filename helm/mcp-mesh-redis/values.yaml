# Redis configuration for MCP Mesh
redis:
  # Redis configuration
  appendonly: "yes"
  maxmemory: "256mb"
  maxmemoryPolicy: "allkeys-lru"

image:
  # Registry prefix for the image. Resolution: this value >
  # global.imageRegistry > "" (Docker Hub). The repository path is preserved:
  # registry: my.registry.internal pulls my.registry.internal/redis —
  # mirror Docker Hub library images to the same single-segment path.
  registry: ""
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

# Pull secrets for this chart's pods, merged with global.imagePullSecrets
# (deduplicated by name). Standard shape:
#   imagePullSecrets:
#     - name: my-registry-credentials
imagePullSecrets: []

# Service configuration
service:
  type: ClusterIP
  port: 6379
  targetPort: redis

# Deployment configuration
replicaCount: 1

# Storage for /data.
#
# The default is an emptyDir, and that is the design: this Redis is a cache and
# a short-lived session/trace store, capped by maxmemory with allkeys-lru
# eviction, so its contents are ephemeral. Nothing in the mesh treats them as
# durable — see "Application data" in the mcp-mesh-core README.
#
# This chart provisions NO volume: it has no PVC template and never had one.
# persistence therefore mounts a claim YOU created, named explicitly:
#
#   persistence:
#     enabled: true
#     existingClaim: my-redis-data
#
# enabled without existingClaim fails at template time. It used to derive a
# claim name from the release instead, which no template ever created, so the
# pod sat Pending forever on a claim nothing would ever bind.
#
# storageClass, accessMode, size and annotations are gone: they configured the
# PVC this chart does not create, so they were read by nothing. Size and class
# belong to whatever creates the claim. Once /data is a ReadWriteOnce volume
# rather than an emptyDir, the strategy note below stops being hypothetical.
persistence:
  enabled: false
  existingClaim: ""

# Deployment update strategy. Empty leaves the field unset, so Kubernetes
# applies its own default (RollingUpdate), which is right for this chart: the
# redis-data mount is an emptyDir cache, so a pod swap contends over nothing
# and there is no reason to change this.
#
# The key is a passthrough for the case where you have pointed this Deployment
# at a ReadWriteOnce volume yourself. Any maxSurge starts the incoming pod
# before the outgoing one is gone; if the scheduler places it on another node it
# cannot mount the claim the outgoing pod still holds, and the rollout hangs
# indefinitely on a Multi-Attach error. Both pods landing on one node is why
# single-node dev clusters never see this. For that case pin the surge to zero:
#
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxSurge: 0
#       maxUnavailable: 1
#
# maxUnavailable must stay non-zero — the API server rejects both being 0. This
# applies cleanly to an already-installed release under both Helm 3 and Helm 4
# with no extra flags, because it replaces the API-defaulted rollingUpdate block
# rather than trying to remove it. Expect one transient
# FailedAttachVolume/Multi-Attach event per rollout while the CSI driver
# detaches; it clears on its own.
strategy: {}

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Health check configuration
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Container security context (hardened for Pod Security Standards
# "restricted"). readOnlyRootFilesystem works because redis only writes /data,
# which is always a volume (PVC or emptyDir).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Extra labels
extraLabels: {}

# Extra environment variables
extraEnvVars: []

# Custom Redis configuration
customConfig: ""
