tempo:
  enabled: true
  image:
    # Registry prefix for the image. Resolution: this value >
    # global.imageRegistry > "" (Docker Hub). The repository path is
    # preserved (registry: my.registry.internal pulls
    # my.registry.internal/grafana/tempo).
    registry: ""
    repository: grafana/tempo
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  # Pull secrets for this chart's pods, merged with global.imagePullSecrets
  # (deduplicated by name). Standard shape:
  #   imagePullSecrets:
  #     - name: my-registry-credentials
  imagePullSecrets: []

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  # Off by default: this volume is a rolling buffer, not durable storage. The
  # `retention` setting below (default 1h) prunes blocks continuously, so the
  # volume never accumulates — a live install measured 3.1MB of /var/tempo after
  # 25 hours of uptime, 0.06% of the 5Gi claim below, with the oldest block 31
  # minutes old. Disabled, Tempo writes its WAL and blocks to an emptyDir and a
  # pod restart costs at most `retention` of buffered traces.
  #
  # The access mode is what made that trade a bad one. A ReadWriteOnce claim on
  # a single-replica Deployment is the reason the rollout below has to terminate
  # the outgoing pod before scheduling its replacement: with any maxSurge the
  # incoming pod can land on another node and hang forever on a Multi-Attach
  # error. That constraint does not exist for an emptyDir.
  #
  # Set enabled: true to keep traces across a pod restart, and read `retention`
  # and `blockDuration` below before sizing it — the right claim size is a
  # function of both. `size: 5Gi` is kept as the opt-in default only so that
  # turning persistence back on does not silently reprovision at a different
  # size for anyone who already had it; at `retention: "1h"` it is roughly
  # 1600x the measured working set, and a few hundred Mi is ample. Scale it
  # from there if you raise retention, not from this number.
  #
  # Upgrading a release that had this enabled drops the PersistentVolumeClaim
  # from the rendered manifest, and Helm deletes it on the next `helm upgrade`.
  # That is intended — what is lost is at most `retention` of buffered traces —
  # but it is not reversible: see "Trace storage (Tempo)" in the
  # mcp-mesh-core chart README before upgrading.
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Deployment update strategy. Empty gets the chart's default: RollingUpdate
  # with maxSurge: 0 and maxUnavailable: 1, which terminates the outgoing pod
  # before scheduling its replacement. That ordering is required, not tuning,
  # whenever persistence above is enabled — this chart runs a single replica
  # against a ReadWriteOnce claim, and with any maxSurge the incoming pod can be
  # scheduled to another node, where it hangs indefinitely on a Multi-Attach
  # error waiting for a claim the outgoing pod still holds. On a single-node
  # cluster it mounts instead, which is worse rather than better: two
  # single-binary Tempo processes briefly write the same WAL and blocks
  # directory. At one replica there is no availability to preserve, so the only
  # cost of ordering the swap is a gap in trace ingestion while the old pod
  # terminates — which is why the default is kept even with persistence off,
  # where an emptyDir imposes no such constraint. `type: Recreate` is redundant
  # here — maxSurge: 0 already orders the swap, and leaving type as
  # RollingUpdate keeps .spec.strategy freely transitionable on later upgrades.
  #
  # With persistence enabled, expect one transient
  # FailedAttachVolume/Multi-Attach event per pod-template change: Kubernetes
  # issues the scale-down and the scale-up in the same second, so the
  # replacement is created while the CSI driver is still detaching the volume
  # from the old node. It clears once the detach completes — under a minute in
  # practice, bounded by terminationGracePeriodSeconds plus detach time — and
  # the rollout converges with no intervention. The event is logged, not silent.
  #
  # Overrides are deep-merged into the above, so set only the keys you mean to
  # change. Note that maxUnavailable must stay non-zero while maxSurge is 0:
  # the API server rejects both being 0.
  strategy: {}

  service:
    type: ClusterIP
    ports:
      http: 3200
      otlpGrpc: 4317
      otlpHttp: 4318
      grpc: 9095

  config:
    # References observability/tempo/tempo.yaml configuration
    server:
      httpListenPort: 3200
      grpcListenPort: 9095

    storage:
      backend: local
      walPath: /var/tempo/wal
      blocksPath: /var/tempo/blocks

    metricsGenerator:
      enabled: true
      prometheusUrl: "http://prometheus:9090/api/v1/write"

    # Retention settings. These two decide how much data /var/tempo ever holds,
    # and therefore what `persistence.size` above would need to be if you turn
    # persistence on: blocks are cut every blockDuration and dropped once they
    # age past retention, so the volume is a rolling window, not an archive.
    # At these defaults a live install held 3.1MB after 25 hours of uptime.
    # Raising retention is what makes the volume grow; blockDuration only
    # changes how coarsely it is pruned.
    retention: "1h"
    blockDuration: "5m"

  # Pod security context (hardened for Pod Security Standards "restricted").
  # Renamed: this key was previously called securityContext (which is now the
  # container security context below) — templating fails with a migration
  # message if an old-shaped override still carries pod-level fields there.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # Container security context. readOnlyRootFilesystem works because tempo
  # only writes under /var/tempo (wal/blocks — PVC or emptyDir) and /tmp
  # (emptyDir).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
