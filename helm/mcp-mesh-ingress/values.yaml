# MCP Mesh Ingress Configuration
# Standalone ingress chart for flexible DNS routing to MCP Mesh services

# Global configuration
global:
  # Base domain for all services
  domain: "mcp-mesh.local"
  # Ingress class to use
  ingressClass: "nginx"
  # Release name the mcp-mesh-core chart was installed under. The core
  # backends default to "<coreReleaseName>-mcp-mesh-<component>", the
  # Service names that release creates. Same key as the mcp-mesh-agent chart.
  # In your own umbrella holding core and this chart, set it to the umbrella's
  # release name.
  coreReleaseName: "mcp-core"
  # An Ingress routes only to Services in its own namespace, so install this
  # chart into the namespace core and the agents run in (-n).

# Ingress routing patterns
patterns:
  # Host-based routing: each service gets its own subdomain
  hostBased:
    enabled: true
    # Additional annotations for host-based ingress
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

  # Path-based routing: all services under one domain with path prefixes
  pathBased:
    enabled: false
    # Main host for path-based routing
    host: "mcp-mesh.local"
    # Additional annotations for path-based ingress
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

# Core infrastructure services
core:
  registry:
    enabled: true
    # Subdomain or path segment
    host: "registry"
    # Backend Service name. Empty derives
    # "<global.coreReleaseName>-mcp-mesh-registry"; a value containing
    # "{{ }}" is rendered with tpl.
    service: ""
    port: 8000
    # Custom path for path-based routing
    path: "/registry(/|$)(.*)"

  # Optional: Expose Redis for debugging/monitoring
  redis:
    enabled: false
    host: "redis"
    service: "" # default: <global.coreReleaseName>-mcp-mesh-redis
    port: 6379
    path: "/redis(/|$)(.*)"

  # Dashboard UI server
  ui:
    enabled: false
    host: "dashboard"
    service: "" # default: <global.coreReleaseName>-mcp-mesh-ui
    port: 3080
    path: "/ops/dashboard(/|$)(.*)"

  # Grafana monitoring dashboard
  grafana:
    enabled: false
    host: "grafana"
    service: "" # default: <global.coreReleaseName>-mcp-mesh-grafana
    port: 3000
    path: "/ops/grafana(/|$)(.*)"

# Agent services. One entry per mcp-mesh-agent release to expose; only name
# is required. The defaults match an agent installed with
# `helm install <name> mcp-mesh-agent` in the same namespace.
agents: []
  # - name: hello-world   # also the default host and path segment
  #   service: ""         # default: <name>-mcp-mesh-agent (the agent chart's Service)
  #   port: 8080          # default: 8080 (the agent chart's service.port)
  #   host: ""            # default: <name> (host-based: <name>.<global.domain>)
  #   path: ""            # default: /<name>(/|$)(.*) (path-based)
  #   enabled: true       # default: true

# TLS configuration
tls:
  enabled: false
  # mTLS passthrough (for agent-to-agent mTLS, don't terminate TLS at ingress)
  mtls:
    passthrough: false
  # TLS certificate configuration
  certificates:
    - secretName: "mcp-mesh-tls"
      hosts:
        - "*.mcp-mesh.local"
        - "mcp-mesh.local"

# Common annotations for all ingress resources
commonAnnotations: {}

# Common labels for all ingress resources
commonLabels:
  app.kubernetes.io/part-of: mcp-mesh-ingress

# Network policy for ops tools (dashboard, Grafana, Tempo)
networkPolicy:
  ops:
    enabled: false
    # Labels that allowed namespaces must have
    allowedNamespaceLabels:
      mcp-mesh.io/ops-access: "true"
