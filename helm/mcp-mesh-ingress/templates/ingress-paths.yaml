{{- include "mcp-mesh-ingress.validate" . -}}
{{- if .Values.patterns.pathBased.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-mesh-ingress.fullname" . }}-paths
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-mesh-ingress.labels" . | nindent 4 }}
    ingress-pattern: path-based
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "mcp-mesh-ingress.annotations" . | nindent 4 }}
    {{- with .Values.patterns.pathBased.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.global.ingressClass }}
  ingressClassName: {{ .Values.global.ingressClass }}
  {{- end }}
  {{- include "mcp-mesh-ingress.tls" . | nindent 2 }}
  rules:
    - host: {{ .Values.patterns.pathBased.host }}
      http:
        paths:
          {{- /* Core services */ -}}
          {{- if .Values.core.registry.enabled }}
          - path: {{ .Values.core.registry.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "registry" "root" $) }}
                port:
                  number: {{ .Values.core.registry.port }}
          {{- end }}

          {{- if .Values.core.redis.enabled }}
          - path: {{ .Values.core.redis.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "redis" "root" $) }}
                port:
                  number: {{ .Values.core.redis.port }}
          {{- end }}

          {{- if .Values.core.ui.enabled }}
          - path: {{ .Values.core.ui.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "ui" "root" $) }}
                port:
                  number: {{ .Values.core.ui.port }}
          {{- end }}

          {{- if .Values.core.grafana.enabled }}
          - path: {{ .Values.core.grafana.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "grafana" "root" $) }}
                port:
                  number: {{ .Values.core.grafana.port }}
          {{- end }}

          {{- /* Agent services */ -}}
          {{- range include "mcp-mesh-ingress.agents" . | fromJsonArray }}
          - path: {{ .path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port | int }}
          {{- end }}
{{- end }}
