{{- include "mcp-mesh-ingress.validate" . -}}
{{- if .Values.patterns.hostBased.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-mesh-ingress.fullname" . }}-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-mesh-ingress.labels" . | nindent 4 }}
    ingress-pattern: host-based
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "mcp-mesh-ingress.annotations" . | nindent 4 }}
    {{- with .Values.patterns.hostBased.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.global.ingressClass }}
  ingressClassName: {{ .Values.global.ingressClass }}
  {{- end }}
  {{- include "mcp-mesh-ingress.tls" . | nindent 2 }}
  rules:
    {{- /* Core services */ -}}
    {{- if .Values.core.registry.enabled }}
    - host: {{ include "mcp-mesh-ingress.hostname" (dict "host" .Values.core.registry.host "domain" .Values.global.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "registry" "root" $) }}
                port:
                  number: {{ .Values.core.registry.port }}
    {{- end }}

    {{- if .Values.core.redis.enabled }}
    - host: {{ include "mcp-mesh-ingress.hostname" (dict "host" .Values.core.redis.host "domain" .Values.global.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "redis" "root" $) }}
                port:
                  number: {{ .Values.core.redis.port }}
    {{- end }}

    {{- if .Values.core.ui.enabled }}
    - host: {{ include "mcp-mesh-ingress.hostname" (dict "host" .Values.core.ui.host "domain" .Values.global.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "ui" "root" $) }}
                port:
                  number: {{ .Values.core.ui.port }}
    {{- end }}

    {{- if .Values.core.grafana.enabled }}
    - host: {{ include "mcp-mesh-ingress.hostname" (dict "host" .Values.core.grafana.host "domain" .Values.global.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-mesh-ingress.coreService" (dict "component" "grafana" "root" $) }}
                port:
                  number: {{ .Values.core.grafana.port }}
    {{- end }}

    {{- /* Agent services */ -}}
    {{- range include "mcp-mesh-ingress.agents" . | fromJsonArray }}
    - host: {{ include "mcp-mesh-ingress.hostname" (dict "host" .host "domain" $.Values.global.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port | int }}
    {{- end }}
{{- end }}
