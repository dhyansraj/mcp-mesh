# MCP Mesh Python Package Configuration

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-mesh"
version = "3.4.0"
description = "Python SDK for MCP Mesh — build distributed AI agents with auto-discovery, dependency injection, and LLM integration"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MCP Mesh Contributors", email = "noreply@mcp-mesh.dev" }
]
keywords = [
    "mcp",
    "kubernetes",
    "ai",
    "agents",
    "orchestration",
    "microservices",
    "distributed"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.11"
# anthropic SDK is included by default for native Claude dispatch (issue #834).
# When MCP_MESH_NATIVE_LLM is unset (default ON), Claude provider agents
# dispatch through the native anthropic SDK; without the SDK they would
# silently fall back to LiteLLM. Heavy backend extras (boto3 for Bedrock)
# stay opt-in via the [anthropic-bedrock] extra.
#
# openai SDK is included by default for native OpenAI dispatch (issue #834
# PR 2). When MCP_MESH_NATIVE_LLM is unset (default ON), OpenAI provider
# agents dispatch through the native openai SDK; without it they would
# silently fall back to LiteLLM. (openai is also a transitive dep of
# litellm today; promoting to a direct base dep prevents breakage if
# litellm ever drops it as transitive.)
#
# google-genai SDK is included by default for native Gemini dispatch
# (issue #834 PR 3). Supports both AI Studio (gemini/*) and Vertex AI
# (vertex_ai/*) backends via constructor flag. When MCP_MESH_NATIVE_LLM
# is unset (default ON), Gemini provider agents dispatch through the
# native google-genai SDK; without it they would silently fall back to
# LiteLLM.
dependencies = [
    # Rust core runtime (required - no Python fallback)
    "mcp-mesh-core>=3.4.0",
    # Floor raised to 0.135.0 (#1402). Anything below 0.133.0 is not merely
    # old, it is unresolvable against our own mcp/fastmcp pins: mcp==1.28.1
    # wants anyio>=4.5 while old FastAPI caps anyio<4.0.0, and fastmcp==3.4.3
    # pulls starlette>=1.0.1 while FastAPI caps starlette<1.0.0 until 0.133.0.
    # 0.133/0.134 install but the route/SSE suite is not green there
    # (is_sse_stream, which the route rebuild keys off, lands in 0.135.0), so
    # 0.135.0 is the lowest version we can honestly claim to support.
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn>=0.24.0,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "urllib3>=2.1.0,<3.0.0",
    "pydantic>=2.4.0,<3.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "typer>=0.9.0,<1.0.0",
    # Pinned exact (#1312): an upstream FastMCP default-flip enabling
    # DNS-rebinding Host validation drifted in on rebuild and broke every
    # k8s Service-DNS /mcp call with 421. Loose ranges hid it. Follow-up:
    # add a full transitive lockfile.
    "mcp==1.28.1",
    "fastmcp==3.4.3",
    # Bounded, never pinned exactly (#1454). The vendor SDKs ship breaking
    # changes on a cadence of their own: openai crossed 1.x -> 2.x while our
    # floor still read >=1.60, and a *minor* (2.14 -> 2.52) added a required
    # response field that broke CI while local envs stayed green. An upper
    # bound at the next major is the strongest constraint expressible here —
    # an exact pin would export our testing constraint onto every user who
    # depends on these SDKs directly, which is why mcp/fastmcp above can be
    # pinned and these cannot. The bound catches the major jump only; the
    # minor-level drift is what the transitive lockfile in #1454 is for.
    #
    # openai floor raised 1.60 -> 2.14: the native adapter imports
    # ``openai.types.responses`` (verified absent in 1.60, added in 1.66) and
    # 2.14 is the oldest release the suite has actually been run against.
    #
    # anthropic is 0.x, where a minor — not a major — is the breaking unit, so
    # <1 is weaker than it looks. It is still the right bound: anthropic has
    # shipped ~120 minors over three years at a near-weekly cadence, so a
    # <0.<next-minor> cap would make mcp-mesh uninstallable alongside a
    # current anthropic within days of every release. 1.0 is the boundary
    # worth failing on; the lockfile covers everything below it.
    #
    # google-genai is capped <3, not <2: 2.0 shipped 2026-05 and a fresh
    # install has resolved 2.x ever since, so <2 would roll us back onto a 1.x
    # line nothing has tested in months.
    "litellm>=1.80.5,!=1.82.7,!=1.82.8,<2",
    "anthropic>=0.77,<1",
    "openai>=2.14,<3",
    "google-genai>=1.22,<3",
    "prometheus-client>=0.19.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1.0",
    "redis>=4.0.0,<7.0.0",
    "cachetools>=5.3.0",
    "watchfiles>=1.0.0",
    # orjson and jsonschema are direct runtime deps, not transitive ones.
    # ``_mcp_mesh.shared.json_fast`` prefers orjson (stdlib json is the
    # slow fallback) and ``mesh.helpers`` imports jsonschema unguarded at
    # module scope for synthetic-tool schema validation (#962), so
    # ``mesh.llm_provider`` fails to import without it. jsonschema happens
    # to arrive via mcp/litellm today and orjson does not arrive at all;
    # declaring both directly prevents breakage if those transitives shift.
    "orjson>=3.10.0",
    "jsonschema>=4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "black>=25.0.0",
    "ruff>=0.11.0",
    "mypy>=1.16.0",
    "pre-commit>=4.0.0",
    "isort>=6.0.0",
    "bandit[toml]>=1.7.0"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-mermaid2-plugin>=1.1.0"
]
kubernetes = [
    "kubernetes>=28.1.0",
    "pykube-ng>=22.9.0"
]
vertex = [
    # google-auth is required for LiteLLM's vertex_ai/* model prefix to read
    # Application Default Credentials. Optional because non-Vertex users (AI
    # Studio, Claude, OpenAI) don't need it. Install via:
    #   pip install mcp-mesh[vertex]
    "google-auth>=2.0.0"
]
anthropic = [
    # Backward-compat alias: ``anthropic`` is now a base dependency (issue
    # #834). This entry is kept so existing ``pip install mcp-mesh[anthropic]``
    # commands continue to work without error.
    "anthropic>=0.77,<1"
]
anthropic-bedrock = [
    # AWS Bedrock backend for the native Anthropic adapter. Required when
    # using ``bedrock/anthropic.claude-*`` model strings. Opt-in because
    # boto3 is a heavy dependency.
    "anthropic[bedrock]>=0.77,<1"
]
openai = [
    # Backward-compat alias: ``openai`` is now a base dependency (issue
    # #834 PR 2). This entry is kept so existing ``pip install mcp-mesh[openai]``
    # commands continue to work without error.
    "openai>=2.14,<3"
]
gemini = [
    # Backward-compat alias: ``google-genai`` is now a base dependency
    # (issue #834 PR 3). This entry is kept so existing
    # ``pip install mcp-mesh[gemini]`` commands continue to work without
    # error.
    "google-genai>=1.22,<3"
]
litellm = [
    # LiteLLM long-tail provider path (issue #1383).
    #
    # DELIBERATELY REDUNDANT TODAY: ``litellm`` is still a BASE dependency
    # above, so ``pip install mcp-mesh[litellm]`` resolves to exactly the same
    # set as ``pip install mcp-mesh``. The extra exists now, ahead of the move,
    # so that a pin written today (by a user, by ``meshctl scaffold``'s
    # generated requirements.txt, or by the install guidance in
    # ``mesh.helpers._require_litellm``) keeps working unchanged when the base
    # entry is deleted at the next major — at that point THIS is the only
    # declaration that installs litellm.
    #
    # This is why the requirement is spelled out in full rather than left as an
    # empty stub: an empty extra resolves cleanly today but would silently
    # install nothing the day the base entry goes away.
    #
    # The pin MUST stay identical to the ``litellm`` entry in [project]
    # dependencies above. Enforced by
    # src/runtime/python/tests/unit/test_litellm_extra_pin_sync.py.
    "litellm>=1.80.5,!=1.82.7,!=1.82.8,<2"
]

[project.urls]
Homepage = "https://github.com/dhyansraj/mcp-mesh"
Documentation = "https://mcp-mesh.ai/"
Repository = "https://github.com/dhyansraj/mcp-mesh"
Issues = "https://github.com/dhyansraj/mcp-mesh/issues"
Discussions = "https://github.com/dhyansraj/mcp-mesh/discussions"

# No CLI scripts - this is a library package
# Use the Go-based meshctl tool for CLI operations


[tool.hatch.build.targets.wheel]
packages = ["_mcp_mesh", "mesh"]

[tool.hatch.build.targets.sdist]
include = [
    "/_mcp_mesh",
    "/mesh",
    "/README.md",
    "/LICENSE"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP007", # Use X | Y for type annotations (Python 3.10+ syntax)
    "UP038", # Use X | Y in isinstance calls
    "F401",  # imported but unused
    "F841",  # local variable assigned but never used
    "C416",  # unnecessary list comprehension
    "C401",  # unnecessary generator
    "E721",  # type comparison issues
    "E722",  # bare except
    "B904",  # raise from err issues
    "B007",  # unused loop variables
    "F821",  # undefined name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/agent_server_generated/**" = ["ALL"]  # Ignore all linting for generated files
"**/registry_client_generated/**" = ["ALL"]  # Ignore all linting for generated files
"tests/**" = ["E712", "F841", "B007", "C401", "F401"]  # Relax style requirements for test files

[tool.mypy]
python_version = "3.11"
check_untyped_defs = false  # Temporarily relaxed
disallow_any_generics = false  # Temporarily relaxed
disallow_incomplete_defs = false  # Temporarily relaxed
disallow_untyped_defs = false  # Temporarily relaxed
no_implicit_optional = false  # Temporarily relaxed
warn_redundant_casts = false  # Temporarily relaxed
warn_unused_ignores = false  # Temporarily relaxed
warn_return_any = false  # Temporarily relaxed
exclude = ["tests/", ".*agent_server_generated.*", ".*registry_client_generated.*"]  # Skip type checking for test and generated files

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
