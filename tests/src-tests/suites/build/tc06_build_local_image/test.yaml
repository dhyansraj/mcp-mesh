# Test Case: Build tsuite-mesh:local Image
# Builds the Docker image from locally compiled packages
#
# IMPORTANT: This test runs on the HOST (standalone mode)
# Run after tc01-tc05 have built all artifacts

name: "Build tsuite-mesh:local Image"
depends_on: [tc05_verify_artifacts]
description: "Build Docker image with locally compiled MCP Mesh packages"
tags:
  - docker
  - build
  - image
  - local
timeout: 1500 # bound the whole test above the 1200s build step

test:
  # Verify Docker is available
  - name: "Verify Docker is available"
    handler: shell
    command: |
      docker --version
      docker info > /dev/null 2>&1 && echo "Docker daemon is running"
    capture: docker_check

  # Verify all artifacts exist
  - name: "Verify build artifacts exist"
    handler: shell
    command: |
      echo "Checking build artifacts..."

      # Check meshctl binary
      if [ ! -f "${run_path}/${config.output.bin}/meshctl" ]; then
        echo "ERROR: meshctl binary not found at ${run_path}/${config.output.bin}/meshctl"
        exit 1
      fi
      echo "  meshctl: OK"

      # Check mcp-mesh-registry binary
      if [ ! -f "${run_path}/${config.output.bin}/mcp-mesh-registry" ]; then
        echo "ERROR: mcp-mesh-registry binary not found at ${run_path}/${config.output.bin}/mcp-mesh-registry"
        exit 1
      fi
      echo "  mcp-mesh-registry: OK"

      # Check meshui binary
      if [ ! -f "${run_path}/${config.output.bin}/meshui" ]; then
        echo "ERROR: meshui binary not found at ${run_path}/${config.output.bin}/meshui"
        exit 1
      fi
      echo "  meshui: OK"

      # Check Python wheels
      WHEEL_COUNT=$(ls "${run_path}/${config.output.wheels}"/*.whl 2>/dev/null | wc -l)
      if [ "$WHEEL_COUNT" -lt 2 ]; then
        echo "ERROR: Expected at least 2 wheels, found $WHEEL_COUNT"
        ls -la "${run_path}/${config.output.wheels}/"
        exit 1
      fi
      echo "  wheels: $WHEEL_COUNT found"

      # Check npm packages
      if ! ls "${run_path}/${config.output.packages}"/*.tgz 1>/dev/null 2>&1; then
        echo "ERROR: No npm tarballs found in ${run_path}/${config.output.packages}"
        exit 1
      fi
      echo "  packages: OK"

      echo ""
      echo "All artifacts ready for image build"
    capture: artifacts_check

  # Prepare build context
  - name: "Prepare build context"
    handler: shell
    command: |
      # Create a temporary build context with all artifacts
      BUILD_DIR=$(mktemp -d)
      echo "BUILD_DIR=$BUILD_DIR"

      # Get Dockerfile and tempo.yaml from artifacts_path
      DOCKERFILE_PATH="${artifacts_path}/Dockerfile"
      TEMPO_CONFIG="${artifacts_path}/tempo.yaml"

      # Copy Dockerfile and tempo.yaml
      cp "$DOCKERFILE_PATH" $BUILD_DIR/
      cp "$TEMPO_CONFIG" $BUILD_DIR/

      # Copy artifacts
      mkdir -p $BUILD_DIR/bin $BUILD_DIR/wheels $BUILD_DIR/packages
      cp "${run_path}/${config.output.bin}/meshctl" $BUILD_DIR/bin/
      cp "${run_path}/${config.output.bin}/mcp-mesh-registry" $BUILD_DIR/bin/
      cp "${run_path}/${config.output.bin}/meshui" $BUILD_DIR/bin/
      cp "${run_path}/${config.output.wheels}"/*.whl $BUILD_DIR/wheels/
      cp "${run_path}/${config.output.packages}"/*.tgz $BUILD_DIR/packages/

      # Create java-jars and native-libs directories (required by Dockerfile COPY)
      # These may be empty if Java SDK wasn't built
      mkdir -p $BUILD_DIR/java-jars $BUILD_DIR/native-libs

      # Copy Java JARs if they exist
      if ls "${run_path}/${config.output.java_jars}"/*.jar 1>/dev/null 2>&1; then
        cp "${run_path}/${config.output.java_jars}"/*.jar $BUILD_DIR/java-jars/
        echo "Java JARs copied"
      else
        echo "No Java JARs found (optional)"
      fi

      # Copy native libs if they exist
      if ls "${run_path}/${config.output.native_libs}"/libmcp_mesh_core.* 1>/dev/null 2>&1; then
        cp "${run_path}/${config.output.native_libs}"/libmcp_mesh_core.* $BUILD_DIR/native-libs/
        echo "Native libs copied"
      else
        echo "No native libs found (optional)"
      fi

      # Copy Maven repository structure if it exists
      mkdir -p $BUILD_DIR/m2-repo
      if [ -d "${run_path}/${config.output.m2_repo}/mcp-mesh" ]; then
        cp -r "${run_path}/${config.output.m2_repo}/mcp-mesh" $BUILD_DIR/m2-repo/
        echo "Maven repo structure copied"
      else
        echo "No Maven repo found (optional)"
      fi

      echo "Build context prepared at $BUILD_DIR"
      ls -la $BUILD_DIR/
      ls -la $BUILD_DIR/wheels/
      ls -la $BUILD_DIR/packages/
      ls -la $BUILD_DIR/java-jars/ 2>/dev/null || echo "java-jars: empty"
      ls -la $BUILD_DIR/native-libs/ 2>/dev/null || echo "native-libs: empty"
    capture: build_context

  # Extract runner binaries for embedding in image
  - name: "Extract runner binaries to build context"
    handler: shell
    command: |
      BUILD_DIR=$(echo "${captured.build_context}" | grep "BUILD_DIR=" | cut -d= -f2)
      API_URL="${TSUITE_API:-http://localhost:9999}"

      echo "Fetching runner binaries from $API_URL..."

      RUNNERS_JSON=$(curl -sf "$API_URL/api/runners" 2>/dev/null)
      if [ $? -ne 0 ] || [ -z "$RUNNERS_JSON" ]; then
        echo "No runner binaries available (API returned no runners)"
        echo "To embed runners, build tsuite with: make build-with-runners"

        # Create empty placeholders so Dockerfile COPY doesn't fail
        for name in tsuite-runner-linux-amd64 tsuite-runner-linux-arm64 select-runner; do
          touch "$BUILD_DIR/bin/$name"
        done

        exit 0
      fi

      EXTRACTED=0
      for name in tsuite-runner-linux-amd64 tsuite-runner-linux-arm64 select-runner; do
        if curl -sf -o "$BUILD_DIR/bin/$name" "$API_URL/api/runners/$name"; then
          chmod +x "$BUILD_DIR/bin/$name"
          SIZE=$(wc -c < "$BUILD_DIR/bin/$name" | tr -d ' ')
          echo "  $name: OK ($SIZE bytes)"
          EXTRACTED=$((EXTRACTED + 1))
        else
          echo "  $name: not available"
        fi
      done

      # Create empty placeholders for missing runners (so Dockerfile COPY doesn't fail)
      for name in tsuite-runner-linux-amd64 tsuite-runner-linux-arm64 select-runner; do
        if [ ! -f "$BUILD_DIR/bin/$name" ]; then
          touch "$BUILD_DIR/bin/$name"
        fi
      done

      echo ""
      if [ $EXTRACTED -gt 0 ]; then
        echo "Extracted $EXTRACTED runner binaries"
      else
        echo "No runner binaries extracted (image will work but won't support Docker/K8s test execution)"
      fi
    capture: runner_extract
    ignore_errors: true

  # Build the image
  - name: "Build tsuite-mesh:local image"
    handler: shell
    command: |
      # Fail the step on the first failing command. Without this the trailing
      # echo below sets the exit status, so a failed docker build reported
      # exit_code 0 and the suite went green against a stale image tag.
      set -euo pipefail
      BUILD_DIR=$(echo "${captured.build_context}" | grep "BUILD_DIR=" | cut -d= -f2)
      IMAGE_NAME="${config.docker.output_image}"

      echo "Building image: $IMAGE_NAME"
      echo "Build context: $BUILD_DIR"

      # A docker tag lives in the shared daemon and survives across runs, so
      # "the tag exists" proves nothing. Record the id it points at now.
      IMAGE_ID_BEFORE=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME" 2>/dev/null || echo "none")
      echo "IMAGE_ID_BEFORE=$IMAGE_ID_BEFORE"

      docker build \
        --no-cache \
        -t "$IMAGE_NAME" \
        -f "$BUILD_DIR/Dockerfile" \
        "$BUILD_DIR"

      IMAGE_ID_AFTER=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")
      echo "IMAGE_ID_AFTER=$IMAGE_ID_AFTER"

      # The build is --no-cache, so a successful build always produces a new
      # image id. An unchanged id therefore cannot be legitimate cache reuse --
      # it means the tag still points at a previous run's image.
      if [ "$IMAGE_ID_AFTER" = "$IMAGE_ID_BEFORE" ]; then
        echo "ERROR: $IMAGE_NAME still points at the pre-build image id."
        echo "docker build --no-cache cannot reuse an image, so no new image was produced."
        exit 1
      fi

      # Cleanup build context
      rm -rf "$BUILD_DIR"

      echo "IMAGE_REBUILT=$IMAGE_NAME $IMAGE_ID_AFTER"
    capture: build_output
    timeout: 1200

  # Verify image was created
  - name: "Verify image was created"
    handler: shell
    command: |
      set -euo pipefail
      docker images ${config.docker.output_image} --format "{{.Repository}}:{{.Tag}} - {{.Size}}"
      # inspect (unlike `docker images`) exits non-zero when the tag is missing
      docker image inspect ${config.docker.output_image} --format 'IMAGE_ID={{.Id}} CREATED={{.Created}}'
    capture: image_info

  # Test the image - verify meshctl, and that it is the one this run built.
  # `meshctl --version` reports "dev" here (tc01 builds without the version
  # ldflags), so its output cannot distinguish a fresh image from a stale one.
  # Comparing the copied binary byte-for-byte against tc01's output can.
  - name: "Test meshctl in image"
    handler: shell
    command: |
      set -euo pipefail
      docker run --rm ${config.docker.output_image} meshctl --version

      HOST_SHA=$(sha256sum "${run_path}/${config.output.bin}/meshctl" | cut -d' ' -f1)
      IMAGE_SHA=$(docker run --rm ${config.docker.output_image} sha256sum /usr/local/bin/meshctl | cut -d' ' -f1)
      echo "host  meshctl sha256: $HOST_SHA"
      echo "image meshctl sha256: $IMAGE_SHA"
      if [ "$HOST_SHA" != "$IMAGE_SHA" ]; then
        echo "ERROR: /usr/local/bin/meshctl in the image does not match the meshctl this run built."
        echo "The image was not built from the current artifacts."
        exit 1
      fi
      echo "MESHCTL_MATCHES_BUILD"
    capture: meshctl_version

  # Test the image - verify mcp-mesh-registry
  - name: "Test mcp-mesh-registry in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} mcp-mesh-registry --help 2>&1 | head -5
    capture: registry_check

  # Test the image - verify meshui
  - name: "Test meshui in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} meshui --help 2>&1 | head -5
    capture: meshui_check

  # Test the image - verify mesh module
  - name: "Test mesh module in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} python -c "import mesh; print('mesh OK')"
    capture: mesh_check

  # Test the image - verify /wheels and /packages exist
  - name: "Verify /wheels and /packages in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} bash -c "ls /wheels/*.whl && ls /packages/*.tgz"
    capture: packages_check

  # Test the image - verify /java-jars and /native-libs exist
  - name: "Verify /java-jars and /native-libs in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} bash -c "
        echo 'java-jars:' && ls /java-jars/ 2>/dev/null | head -5 || echo '  (empty)'
        echo 'native-libs:' && ls /native-libs/ 2>/dev/null | head -5 || echo '  (empty)'
        # Check if Java and Maven are available
        java -version 2>&1 | head -1
        mvn --version 2>&1 | head -1
      "
    capture: java_check

  # Test the image - verify node
  - name: "Test Node.js in image"
    handler: shell
    command: |
      docker run --rm ${config.docker.output_image} node --version
    capture: node_version

  # Print summary
  - name: "Print summary"
    handler: shell
    command: |
      echo ""
      echo "=========================================="
      echo "tsuite-mesh:local built successfully!"
      echo "=========================================="
      echo ""
      echo "Image: ${config.docker.output_image}"
      echo "meshctl: ${captured.meshctl_version}"
      echo "node: ${captured.node_version}"
      echo "java: OK"
      echo "maven: OK"
      echo "mesh: OK"
      echo ""
      echo "To use with integration tests:"
      echo "  1. Update integration/config.yaml:"
      echo "     docker:"
      echo "       base_image: \"${config.docker.output_image}\""
      echo ""
      echo "  2. Run integration tests:"
      echo "     cd integration && tsuite --all --docker"
      echo ""
      echo "The handlers will auto-detect /wheels and /packages"
      echo "and install from local builds."
      echo "=========================================="
    capture: summary

  # Push image to local registry (for K8s cluster access)
  - name: "Push image to local registry"
    handler: shell
    command: |
      IMAGE_NAME="${config.docker.output_image}"
      REGISTRY="${config.docker.registry}"

      if [ -z "$REGISTRY" ]; then
        echo "No registry configured (docker.registry not set)"
        echo "Skipping push - image only available locally"
        exit 0
      fi

      REMOTE_IMAGE="${REGISTRY}/${IMAGE_NAME}"
      echo "Pushing $IMAGE_NAME to $REMOTE_IMAGE..."

      docker tag "$IMAGE_NAME" "$REMOTE_IMAGE"
      docker push "$REMOTE_IMAGE"

      echo "REMOTE_IMAGE=$REMOTE_IMAGE"
      echo "Push complete"
    capture: registry_push
    ignore_errors: true

assertions:
  # Docker should be available
  - expr: ${captured.docker_check} contains 'Docker daemon is running'
    message: "Docker daemon should be running"

  # Artifacts should exist
  - expr: ${captured.artifacts_check} contains 'All artifacts ready'
    message: "All build artifacts should exist"

  # Build should succeed AND have produced a new image (not reused the tag).
  # Under `set -e` plus the id-changed guard, this marker is only reached when
  # docker build ran and replaced the image.
  - expr: ${captured.build_output} contains 'IMAGE_REBUILT='
    message: "Docker build should succeed and produce a new image"

  # Image should exist
  - expr: ${captured.image_info} contains 'tsuite-mesh:local'
    message: "Image should be created"

  # meshctl should work and be the binary this run built
  - expr: ${captured.meshctl_version} contains 'MESHCTL_MATCHES_BUILD'
    message: "meshctl in the image should be byte-identical to the one this run built"

  # mcp-mesh-registry should work
  - expr: ${captured.registry_check} contains 'registry'
    message: "mcp-mesh-registry should be installed and working"

  # meshui should work
  - expr: ${captured.meshui_check} contains 'meshui'
    message: "meshui should be installed and working"

  # mesh module should work
  - expr: ${captured.mesh_check} contains 'mesh OK'
    message: "mesh module should be importable"

  # Packages should exist in image
  - expr: ${captured.packages_check} contains '.whl'
    message: "/wheels should contain wheel files"

  # Node should be installed
  - expr: ${captured.node_version} contains 'v22'
    message: "Node.js 22 should be installed"

  # Java should be installed
  - expr: ${captured.java_check} contains 'openjdk'
    message: "Java should be installed"

  # Maven should be installed
  - expr: ${captured.java_check} contains 'Apache Maven'
    message: "Maven should be installed"
