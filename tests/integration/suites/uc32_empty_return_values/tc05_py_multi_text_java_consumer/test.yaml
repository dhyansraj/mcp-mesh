# Test Case: Multiple text content blocks (Python provider -> Java consumer)
# Regression test for issue #1630 (part 1): when a provider returned several
# MCP text content blocks, the Java consumer kept only the first one and
# silently dropped the rest.
#
# Provider: py-empty-provider.get_text_blocks (capability multi_text_source)
# returns [TextContent("alpha"), TextContent("beta"), TextContent("gamma")]
# with no return annotation, so the wire result is three text blocks in
# `content` and NO structuredContent.
#
# Contract:
#   - untyped McpMeshTool<Object> receives EVERY block, in order, as a
#     List of raw MCP content items ({type: text, text: ...})
#   - typed McpMeshTool<String> cannot hold three blocks, so the call fails
#     with a clear "text content blocks" error - never a truncated "alpha"
#
# The Java consumer probes:
#   probeMultiText          - untyped proxy; reports valueType, blockCount,
#                             texts (in order) and valueJson
#   probeMultiTextAsString  - typed String proxy; reports the exception
#                             message chain in `error` (or the value if the
#                             call unexpectedly succeeded)
#
# Uses UC-level artifacts from /uc-artifacts

name: "Multiple Text Blocks: Python provider -> Java consumer"
description: "Verify a Java consumer receives all text content blocks, in order, when a Python tool returns several (untyped proxy), and a typed String proxy fails clearly instead of truncating"
tags:
  - tools
  - cross-agent
  - dependency
  - multi-text
  - regression
  - python
  - java
timeout: 480

pre_run:
  - routine: global.setup_for_python_agent
    params:
      meshctl_version: "${config.packages.cli_version}"
      mcpmesh_version: "${config.packages.sdk_python_version}"
  - routine: global.setup_for_java_agent
    params:
      meshctl_version: "${config.packages.cli_version}"

test:
  # Copy artifacts
  - name: "Copy artifacts to workspace"
    handler: shell
    command: |
      cp -r /uc-artifacts/py-empty-provider /workspace/
      cp -r /uc-artifacts/java-empty-consumer /workspace/
    capture: copy_output

  # Install Maven dependencies for the Java consumer
  - name: "Install Maven dependencies"
    handler: maven-install
    path: /workspace/java-empty-consumer
    timeout: 600

  # Start provider. No registration wait before starting the consumer:
  # the consumer's settle window covers dependency arrival order.
  - name: "Start multi-text provider (Python)"
    handler: shell
    command: "meshctl start py-empty-provider/main.py -d"
    workdir: /workspace
    capture: start_provider

  # Start consumer.
  # MCP_MESH_SETTLE_TIMEOUT=60 (settling-window dependency grace, PR #1200):
  # calls arriving before the multi_text_source dependency resolves are held
  # until resolution lands - no fixed dep-resolution sleeps.
  - name: "Start probe consumer (Java)"
    handler: shell
    command: "meshctl start /workspace/java-empty-consumer --env MCP_MESH_SETTLE_TIMEOUT=60 -d"
    workdir: /workspace
    capture: start_consumer

  # Liveness only: wait for both agents to REGISTER (meshctl call routes via
  # the registry). The Java consumer cold-compiles (mvn spring-boot:run) at
  # start, which can exceed 90s under cluster load - hence the 240s loop.
  # Dependency resolution is covered by the settle window.
  - name: "Wait for both agents to register"
    handler: shell
    workdir: /workspace
    command: |
      echo "Waiting for both agents to register..."
      for i in $(seq 1 120); do
        AGENTS=$(meshctl list 2>/dev/null || true)
        if echo "$AGENTS" | grep -q "py-empty-provider" && echo "$AGENTS" | grep -q "java-empty-consumer"; then
          echo "Both agents registered after ~$((i*2))s"
          exit 0
        fi
        sleep 2
      done
      echo "ERROR: agents did not register within 240s"
      echo "=== Agent logs ==="
      meshctl logs py-empty-provider 2>/dev/null | tail -50 || true
      meshctl logs java-empty-consumer 2>/dev/null | tail -50 || true
      exit 1
    capture: wait_registration
    timeout: 260

  # Untyped McpMeshTool<Object> proxy - must receive all three blocks
  - name: "Probe multiple text blocks (untyped proxy)"
    handler: shell
    workdir: /workspace
    command: "meshctl call probeMultiText '{}'"
    capture: probe_multi_text

  # Typed McpMeshTool<String> proxy - must fail clearly, not truncate
  - name: "Probe multiple text blocks (typed String proxy)"
    handler: shell
    workdir: /workspace
    command: "meshctl call probeMultiTextAsString '{}'"
    capture: probe_multi_text_string

assertions:
  # IDIOM: the equality lives INSIDE the jq filter so the interpolation
  # yields a bare true/false (tsuite Go-formats extracted values, so direct
  # comparison of arrays/objects is unreliable). The interpolation body
  # cannot contain '}' (parsed as [^}]+).

  # Dependency was injected (uniform guard with tc01-tc04)
  - expr: "${captured.probe_multi_text} not contains 'not injected'"
    message: "multi_text_source dependency must be injected"

  # Untyped: every block arrives, in order
  - expr: "${jq:captured.probe_multi_text:(.content[0].text | fromjson | .valueType) == \"list\"} == 'true'"
    message: "Several text blocks must arrive as a Java List - not a String holding only the first block"
  - expr: "${jq:captured.probe_multi_text:(.content[0].text | fromjson | .blockCount) == 3} == 'true'"
    message: "All 3 text content blocks must reach the Java consumer (previously only the first survived)"
  - expr: "${jq:captured.probe_multi_text:(.content[0].text | fromjson | .texts) == [\"alpha\",\"beta\",\"gamma\"]} == 'true'"
    message: "Text blocks must arrive in order: alpha, beta, gamma"
  - expr: "${jq:captured.probe_multi_text:(.content[0].text | fromjson | .valueJson | fromjson | map(.type)) == [\"text\",\"text\",\"text\"]} == 'true'"
    message: "Each received item must be a raw MCP text content item (type == text)"

  # Typed String: clear error, no truncated value
  - expr: "${captured.probe_multi_text_string} not contains 'not injected'"
    message: "multi_text_source dependency must be injected for the typed probe"
  - expr: "${jq:captured.probe_multi_text_string:(.content[0].text | fromjson | .valueType) == \"error\"} == 'true'"
    message: "A McpMeshTool<String> call on 3 text blocks must fail - not return a truncated value"
  - expr: "${jq:captured.probe_multi_text_string:(.content[0].text | fromjson | .error // \"\") | contains(\"text content blocks\")} == 'true'"
    message: "The typed String failure must name the cause ('text content blocks')"
  - expr: "${jq:captured.probe_multi_text_string:(.content[0].text | fromjson | .valueJson) == null} == 'true'"
    message: "The typed String probe must not receive a value (e.g. a truncated \"alpha\")"

post_run:
  - handler: shell
    workdir: /workspace
    command: |
      meshctl stop 2>/dev/null || true
      pkill -f "spring-boot:run" 2>/dev/null || true
      pkill -f "java.*empty" 2>/dev/null || true
    ignore_errors: true
  - routine: global.cleanup_workspace
